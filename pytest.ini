[pytest]
testpaths = tests
addopts = -v --tb=short
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
markers =
    unit: fast unit tests using mocks (no browser, no DB)
    integration: tests requiring DB or cross-module collaboration
    browser: Playwright browser interaction tests
    e2e: end-to-end tests that require a real browser and network
    slow: tests that take more than 10 seconds
    schedule: schedule publish UI interaction tests
