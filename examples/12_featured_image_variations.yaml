# ── 썸네일 자동 다양화 캠페인 ─────────────────────────
# 트리 키워드(region + district)로 콤보를 한 캠페인에서 펼치고,
# variation 프로파일들로 콤보마다 썸네일을 시각적으로 다르게 만든다.
#
# 똑같은 base thumb.jpg 한 장으로 시작해도 콤보마다:
#   - AI 배경 레이어가 다른 분위기/색조로 생성됨
#   - 데코레이션 워터마크가 풀에서 다르게 골라짐
#   - 색감 효과(hue/saturation/brightness)가 다른 조합으로 들어감
#   - 오버레이 카피 문구가 다른 표현으로 박힘
#
# 결과: 콤보 하나당 시각적으로 식별 가능한 썸네일 → 본문은 AI variation으로,
# 썸네일은 layer variation으로 둘 다 다양화 → 전체 포스트 유사도가 떨어진다.
#
# ─────────────────────────────────────────────────────────

platform: naver

browser:
  viewport: [1920, 1080]
  locale: ko-KR
  timezone: Asia/Seoul

accounts:
  - username: naver_id
    password: pw
    blog_id: myblog

# ─────────────────────────────────────────────────────────
# 콤보: region(평면) × district(트리) × subject(평면) × titles
#   = 3 × (2+2+2) × 1 × 1 = 6 콤보
# ─────────────────────────────────────────────────────────

titles:
  - "{keyword:region} {keyword:district} {keyword:subject}과외 {pool:hook}"

keywords:
  region: [강남, 서초, 송파]
  district:
    parent: region
    by:
      강남: [대치동, 목동]
      서초: [반포동, 잠원동]
      송파: [잠실동, 가락동]
  subject: [수학]

pools:
  hook: [솔직 후기, 학부모 추천, 실전 가이드]

# ─────────────────────────────────────────────────────────
# variation 프로파일 — 썸네일 다양화의 핵심
# ─────────────────────────────────────────────────────────

variations:

  # 1) AI 배경 레이어용 — 4축이라 5×5×5×5 = 625가지 조합
  thumb_bg:
    axes:
      time:
        - "golden hour"
        - "blue hour"
        - "soft daylight"
        - "overcast afternoon"
        - "late evening warm light"
      mood:
        - "calm and focused"
        - "energetic and vibrant"
        - "peaceful nostalgic"
        - "motivated determined"
        - "hopeful uplifting"
      style:
        - "minimalist composition"
        - "cinematic depth"
        - "editorial photography"
        - "soft documentary"
        - "painterly textured"
      palette:
        - "warm earth tones"
        - "cool blue palette"
        - "muted pastels"
        - "monochrome with single accent"
        - "deep contrast bold"
    template: "{time}, {mood} mood, {style}, {palette}"

  # 2) 색감 톤 변형 — 효과 문자열을 그대로 axes에 박아둔다.
  #    효과 안의 ~ 범위는 image_processor가 그대로 처리.
  thumb_tone:
    axes:
      hue:
        - "hue:-0.03 ~ 0.0"
        - "hue:0.0 ~ 0.03"
        - "hue:0.02 ~ 0.05"
      saturation:
        - "saturation:0.85 ~ 0.95"
        - "saturation:0.95 ~ 1.05"
        - "saturation:1.05 ~ 1.20"
      brightness:
        - "brightness:0.92 ~ 1.0"
        - "brightness:0.98 ~ 1.05"
        - "brightness:1.0 ~ 1.08"

  # 3) 데코레이션 워터마크 풀 — 콤보마다 다른 PNG 파일이 얹힌다.
  #    실제로는 assets/decorations/ 아래에 wave.png, grid.png 등을 미리 둔다.
  thumb_deco:
    axes:
      file:
        - "decorations/wave.png"
        - "decorations/grid.png"
        - "decorations/dots.png"
        - "decorations/rays.png"
        - "decorations/frame.png"

  # 4) 오버레이 텍스트 카피 변형
  thumb_copy:
    axes:
      tagline:
        - "검증된 학부모 후기"
        - "현장 리포트"
        - "직접 본 후기"
        - "실전 경험담"
      cta:
        - "지금 확인하세요"
        - "자세히 보기"
        - "한눈에 정리"
        - "필독"
    template: "{tagline} · {cta}"

# ─────────────────────────────────────────────────────────
# post 블록 — 본문은 짧게, 핵심은 featured_image
# ─────────────────────────────────────────────────────────

post:
  - h2: "{keyword:district} {keyword:subject}과외 후기"

  - paragraph: |
      {keyword:region} {keyword:district}에서 {keyword:subject}과외를 찾는
      학부모를 위한 실전 가이드를 자연스럽게 작성해줘. 첫 단락에서
      {keyword:district}의 학구열과 분위기를 1~2 문장으로 짚고 시작.

  - featured_image:
      path: thumb.jpg                                    # base 썸네일
      overlay_text: "{keyword:district} {keyword:subject}과외\n{variation:thumb_copy}"
      overlay_color: "#FFFFFF"
      overlay_background: 0.55
      overlay_position: bottom
      filename_keyword: "{keyword:district}"             # 업로드 파일명 키워드

      layers:
        # ── (1) AI 배경: 콤보마다 다른 mood/time/style/palette 조합 ──
        # opacity 0.18 정도로 깔아 base 사진의 인식성을 유지
        - type: ai
          prompt: "{keyword:district} {keyword:subject} education aesthetic — {variation:thumb_bg}"
          opacity: 0.18
          fit: cover

        # ── (2) 색감 톤: 효과 문자열을 variation 풀에서 매번 다르게 ──
        - type: effect
          effect: "{variation:thumb_tone.hue}"
        - type: effect
          effect: "{variation:thumb_tone.saturation}"
        - type: effect
          effect: "{variation:thumb_tone.brightness}"

        # ── (3) 가장자리 vignetting: 톤 안정화 ──
        - type: effect
          region: "border:8% ~ 14%"
          effect: "brightness:0.85 ~ 0.95"

        # ── (4) 데코레이션 워터마크: 풀에서 콤보마다 다른 PNG 선택 ──
        # opacity는 낮게 + fit:contain 으로 비율 유지
        - type: image
          path: "{variation:thumb_deco.file}"
          opacity: 0.25
          fit: contain

  - paragraph: |
      이번 단락은 비용/시간/효과 관점에서 정리하고, 자연스럽게 CTA로
      마무리해줘.

assets: ./images

# ─────────────────────────────────────────────────────────
# 한 달 뒤 같은 시각에 6개 모두 예약발행
# ─────────────────────────────────────────────────────────

publish:
  schedule: 'at 2026-05-28 09'
  tags: [교육, 과외]
  visibility: public

run:
  interval: 30s
  on_failure: continue
  headless: true

# ─────────────────────────────────────────────────────────
# 실행 결과 (예상)
# ─────────────────────────────────────────────────────────
#
# 콤보 [1] 강남 + 대치동 + 수학:
#   AI 프롬프트: "대치동 수학 education aesthetic — golden hour, calm and focused mood, ..."
#   필터:        hue:-0.03~0.0, saturation:1.05~1.20, brightness:0.98~1.05
#   워터마크:    decorations/wave.png
#   카피:        "검증된 학부모 후기 · 자세히 보기"
#
# 콤보 [2] 강남 + 목동 + 수학:
#   AI 프롬프트: "목동 수학 education aesthetic — blue hour, energetic vibrant mood, ..."
#   필터:        hue:0.0~0.03, saturation:0.95~1.05, brightness:0.92~1.0
#   워터마크:    decorations/grid.png
#   카피:        "현장 리포트 · 한눈에 정리"
#
# ... 이런 식으로 6개 콤보가 각각 다른 mood/색감/데코/카피의 썸네일을 갖는다.
#
# 같은 콤보 인덱스는 항상 같은 결과 → 캠페인 재시작/재시도해도 일관됨.
