# ── {i} 카운터 + 수동 글감 ────────────────────────────────
# 조합마다 다른 이미지와 텍스트 파일을 매핑하는 경우.
# {i}는 1부터 시작하는 조합 인덱스.

platform: naver

browser:
  viewport: [1920, 1080]
  fingerprint:
    webdriver: false

accounts:
  - username: edu_blog
    password: pw1
    blog_id: edublog

titles:
  - "{keyword:region} {keyword:subject} 과외 #{i}"

keywords:
  region: [수리, 산본, 금정]
  subject: [수학]

post:
  - h2: "{keyword:region} {keyword:subject} 과외"
  - text:
      file: "{i}.txt"            # 1.txt, 2.txt, 3.txt ...
  - image: "{keyword:region}.jpg"
    wait: 3s
  - paragraph: "{keyword:region} 지역의 교육 환경을 설명해줘"
  - featured_image:
      path: "{i}.jpg"
      overlay_text: "{keyword:region} 과외 #{i}"
      overlay_background: 0.4
      overlay_position: bottom
      effects:
        - effect: "hue:0.0 ~ 0.05"
        - effect: "brightness:0.9 ~ 1.1"
      wait: 3s

assets: ./asset/images

publish:
  schedule: '++ 15m'
  tags: [교육, 과외]

run:
  interval: 60s
  headless: true
