# ── {i} 카운터 활용 ──────────────────────────────────────
# 조합마다 다른 이미지를 매핑하는 경우.

accounts:
  - username: edu_blog
    password: pw1
    blog_id: edublog

titles:
  - "{keyword:region} {keyword:subject} 과외 #{i}"

keywords:
  region: [수리, 산본, 금정]
  subject: [수학]

post:
  - h2: "{keyword:region} {keyword:subject} 과외"
  - paragraph: "{keyword:region} {keyword:subject} 과외를 소개해줘"
  - image: "{keyword:region}.jpg"
  - paragraph: "{keyword:region} 지역의 교육 환경을 설명해줘"
  - featured_image:
      path: "{i}.jpg"
      overlay_text: "{keyword:region} 과외 #{i}"
      overlay_background: 0.4
      overlay_position: bottom

images: ./asset/images

publish:
  schedule: '++ 15m'
  tags: [교육, 과외]

run:
  interval: 60s
  headless: true
