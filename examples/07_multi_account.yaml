# ── 계정별 오버라이드 ────────────────────────────────────

# Redis로 세션 관리 (여러 머신에서 공유)
# session_store: redis://localhost:6379

accounts:
  - username: main_account
    password: pw1
    blog_id: mainblog
    session: main_session.json    # 명시 경로 우선 (file 모드)
    proxy: 1.2.3.4:8080

  - username: sub_account
    password: pw2
    blog_id: subblog
    # session 없으면 → store.save("sub_account", ...) 자동
    headless: false
    interval: 120s

titles:
  - "{keyword:region} {keyword:subject} 과외 {pool:cta}"

keywords:
  region: [강남, 서초, 잠실, 송파, 강동]
  subject: [수학, 영어, 국어]

pools:
  cta: [지금 신청, 무료 상담, 즉시 가능, 성적 보장]

post:
  - h2: "{keyword:region} {keyword:subject} 과외 소개"
  - paragraph: "{keyword:region} {keyword:subject} 과외를 소개해줘"
  - image:
      src: body.jpg
      link: "tel:01012345678"
  - quote: {text: "배움에는 끝이 없다", by: "공자"}
  - paragraph: "{keyword:region} {keyword:subject} 과외 후기를 감성적으로 써줘"
  - divider
  - paragraph: "{keyword:region} {keyword:subject} 과외 홍보 마무리. 행동 유도 포함"
  - thumbnail:
      src: thumb.jpg
      link: "tel:01012345678"
      overlay: "{keyword:region} {keyword:subject} 과외"
      background: 0.5
      position: bottom

images: ./images

publish:
  schedule: 'now + 1h'
  tags: [교육, 과외]

run:
  interval: 60s
  max_daily: 15
  on_failure: stop
  headless: true
