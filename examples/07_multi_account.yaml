# ── 다중 계정 캠페인 ────────────────────────────────────
# 계정별 분배: weight(비율), min_posts(최소 보장), max_posts(상한)
# 적용 순서: min_posts 보장 → 나머지를 weight로 분배 → max_posts 캡

platform: naver
naver:
  blog_id: mainblog

accounts:
  - username: main_account
    password: pw1
    session: main_session.json
    proxy: 1.2.3.4:8080
    weight: 3             # 나머지를 3배 비율로
    max_posts: 60         # 최대 60개

  - username: sub_account
    password: pw2
    weight: 1
    min_posts: 10         # 최소 10개 보장 (웜업)
    max_posts: 25         # 최대 25개

titles:
  - "{keyword:region} {keyword:subject} 과외 {pool:cta}"

keywords:
  region: [강남, 서초, 잠실, 송파, 강동]
  subject: [수학, 영어, 국어]

pools:
  cta: [지금 신청, 무료 상담, 즉시 가능, 성적 보장]

post:
  - h2: "{keyword:region} {keyword:subject} 과외 소개"
  - paragraph: "{keyword:region} {keyword:subject} 과외를 소개해줘"
  - image:
      path: body.jpg
      link: "tel:01012345678"
  - quote: {text: "배움에는 끝이 없다", attribution: "공자"}
  - paragraph: "{keyword:region} {keyword:subject} 과외 후기를 감성적으로 써줘"
  - divider
  - paragraph: "{keyword:region} {keyword:subject} 과외 홍보 마무리. 행동 유도 포함"
  - featured_image:
      path: thumb.jpg
      link: "tel:01012345678"
      overlay_text: "{keyword:region} {keyword:subject} 과외"
      overlay_background: 0.5
      overlay_position: bottom

images: ./images

publish:
  schedule: 'now + 1h'
  tags: [교육, 과외]

run:
  interval: 60s
  max_daily: 15
  on_failure: stop
  headless: true
