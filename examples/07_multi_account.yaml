# ── 계정별 오버라이드 ────────────────────────────────────

accounts:
  - username: main_account
    password: pw1
    blog_id: mainblog
    session: main_session.json
    proxy: 1.2.3.4:8080

  - username: sub_account
    password: pw2
    blog_id: subblog
    headless: false
    interval: 120s

titles:
  - "{keyword:region} {keyword:subject} 과외 {pool:cta}"

keywords:
  region: [강남, 서초, 잠실, 송파, 강동]
  subject: [수학, 영어, 국어]

pools:
  cta: [지금 신청, 무료 상담, 즉시 가능, 성적 보장]

post:
  - h2: "{keyword:region} {keyword:subject} 과외 소개"
  - paragraph: "{keyword:region} {keyword:subject} 과외를 소개해줘"
  - image: body.jpg
  - paragraph: "{keyword:region} {keyword:subject} 과외 후기를 감성적으로 써줘"
  - paragraph: "{keyword:region} {keyword:subject} 과외 홍보 마무리. 행동 유도 포함"
  - thumbnail: {src: thumb.jpg, overlay: "{keyword:region} {keyword:subject} 과외"}

images: ./images

publish:
  schedule: fixed 09:00
  tags: [교육, 과외]
  visibility: public

run:
  interval: 60s
  max_daily: 15
  on_failure: stop
  headless: true
