# ── Campaign DSL Specification v8 ────────────────────────
#
# 원칙: 쓰는 게 곧 결과. 보이는 게 전부. 암묵적 동작 없음.

# ═══════════════════════════════════════════════════════════
# DSL 토큰 — 어디서든 동일하게 동작
# ═══════════════════════════════════════════════════════════
#
#   {keyword:slug}  — keywords[slug] 결정적 치환
#   {pool:slug}     — pools[slug] 랜덤 선택
#   {map:slug}      — maps[slug] 룩업 결과
#   {i}             — 1부터 시작하는 조합 인덱스

# ═══════════════════════════════════════════════════════════
# platform (필수) — 플랫폼 선언
# ═══════════════════════════════════════════════════════════
#
# platform: naver

# ═══════════════════════════════════════════════════════════
# browser (선택) — 브라우저 환경 + 핑거프린트 위장
# ═══════════════════════════════════════════════════════════
#
# browser:
#   viewport: [1920, 1080]                    # 화면 크기 (기본 1920x1080)
#   user_agent: "Mozilla/5.0 ..."             # User-Agent (기본 Playwright 기본값)
#   locale: ko-KR                             # 브라우저 locale (기본 ko-KR)
#   timezone: Asia/Seoul                      # 시간대 (기본 Asia/Seoul)
#   color_scheme: light                       # light | dark (기본 light)
#   device_scale_factor: 1                    # DPI 배율 (기본 1)
#   geolocation: [37.497, 127.027]            # 위치 위장 [위도, 경도]
#
#   fingerprint:                              # 안티 봇 탐지 위장
#     webdriver: false                        # navigator.webdriver 위장 (기본 false)
#     plugins: true                           # navigator.plugins 위장 (기본 true)
#     chrome_runtime: true                    # window.chrome.runtime 위장 (기본 true)
#     languages: true                         # navigator.languages 위장 (기본 true)
#
# 계정별 오버라이드:
#   accounts:
#     - username: id
#       browser:                              # 이 계정만 다른 fingerprint
#         viewport: [1440, 900]
#         user_agent: "Mozilla/5.0 (Macintosh; ...) ..."
#         geolocation: [37.517, 127.047]

# ═══════════════════════════════════════════════════════════
# accounts (필수) — 인증 정보 + 분배 설정. 최소 1개
# ═══════════════════════════════════════════════════════════
#
# accounts:
#   - username: id
#     password: pw
#     blog_id: myblog              # 블로그 ID
#     session: my_session.json    # 명시 경로 (선택)
#     weight: 3                   # 분배 비율 (기본 1)
#     min_posts: 10               # 최소 보장 (기본 0)
#     max_posts: 60               # 상한 캡 (기본 0 = 무제한)
#
# 적용 순서: min_posts 보장 → 나머지를 weight로 분배 → max_posts 캡

# ═══════════════════════════════════════════════════════════
# titles (필수) — 제목 템플릿
# ═══════════════════════════════════════════════════════════
#
# titles:
#   - "{pool:prefix} {keyword:region} {keyword:subject} 과외"

# ═══════════════════════════════════════════════════════════
# keywords (필수) — 조합 = ∏(카테고리별 값 수) × titles 수
# ═══════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════
# pools (선택) — 매번 랜덤
# ═══════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════
# maps (선택) — 외부 YAML 파일 키:값 매핑
# ═══════════════════════════════════════════════════════════
#
# 맵 파일 (순수 데이터, maps/region_photo.yaml):
#
#   1:1 매핑 (문자열):
#     강남: gangnam.jpg
#     서초: seocho.jpg
#     _default: default.jpg
#
#   1:N 매핑 (리스트 -- 블록 자동 확장):
#     가경동: [가경점.jpg]
#     다산동: [다산점1.jpg, 다산점2.jpg, 다산점3.jpg, 다산점4.jpg]
#     _default: [default.jpg]
#
#   1:N일 때 해당 블록이 값 개수만큼 자동 복제됩니다.
#   예: 다산동 조합 + - image: {path: "{map:photo}"}
#       -> image 블록 4개 자동 생성
#
# 캠페인에서 참조:
#   maps:
#     photo:
#       file: maps/region_photo.yaml
#       by: "{keyword:region}"
#     link:
#       file: maps/region_link.yaml
#       by: "{keyword:region}"
#
# 사용: {map:photo}, {map:link} -- 어디서든 토큰으로 사용
#   - image: {path: "{map:photo}", link: "{map:link}"}
#   - featured_image: {path: "{map:photo}", link: "{map:link}"}

# ═══════════════════════════════════════════════════════════
# post (선택) — 블록 리스트. 코어 Block 필드명과 동일.
# ═══════════════════════════════════════════════════════════
#
# ── h1~h6 (소제목)
#   - h2: "{keyword:region} 소개"
#
# ── paragraph (값 = AI 프롬프트)
#   - paragraph: "{keyword:region} 과외를 소개해줘"
#
# ── text (코어: TextBlock — 수동 텍스트, AI 없음)
#
#   인라인 모드 — DSL 안에서 직접 작성 (토큰 치환 적용):
#   - text: "{keyword:region} 중등 수학학원은 대표 전문 학원입니다."
#
#   파일 모드 — 외부 파일 내용 삽입:
#   - text:
#       file: "{keyword:region}/{i}.txt"
#       format: html                             # plain(기본) | html
#
#   파일 모드 format:
#     plain — 빈 줄(\\n\\n) 기준 <p> 분리, 단일 줄바꿈은 <br>
#     html  — 파일 내용 그대로 삽입
#   파일 없으면 에러. UTF-8 인코딩.
#
# ── image (코어: ImageBlock)
#   - image: "{keyword:region}.jpg"
#   - image: {path: photo.jpg, alt: "{keyword:region} 외관"}
#   - image: {path: photo.jpg, link: "tel:01012345678"}
#   - image:
#       path: photo.jpg
#       effects:
#         - region: "border:10 ~ 30"
#           effect: "brightness:0.3 ~ 0.7"
#
# ── featured_image (코어: FeaturedImageBlock)
#   - featured_image: thumb.jpg
#   - featured_image:
#       path: thumb.jpg
#       overlay_text: "{keyword:region} 과외"
#       overlay_color: "#FFD700"
#       overlay_background: 0.6
#       overlay_position: bottom
#       link: "tel:01012345678"
#       gps: [37.497, 127.027]
#       filename_keyword: "gangnam-tutor"
#       effects:
#         - effect: "hue:0.0 ~ 0.03"
#         - effect: "saturation:0.7 ~ 1.3"
#         - effect: "brightness:0.95 ~ 1.05"
#         - region: "border:5% ~ 15%"
#           effect: "blur:3 ~ 8"
#
# ── effects 영역 지정 효과 (image, featured_image 공통)
#
#   effects는 리스트이며, 순서대로 적용된다.
#   region 생략 시 "all" (전체).
#   ~ 를 사용하면 범위 내 랜덤 값.
#
#   region 옵션:
#     "all"              — 전체 (기본)
#     "border:20"        — 테두리 20px
#     "border:10%"       — 테두리 (짧은 변 기준 10%)
#     "border:10 ~ 30"   — 테두리 10~30px 랜덤
#     "border:5% ~ 15%"  — 테두리 5~15% 랜덤
#     "center:60%"       — 중앙 60%
#     "top:30%"          — 상단 30%
#     "bottom:30%"       — 하단 30%
#     "left:30%"         — 좌측 30%
#     "right:30%"        — 우측 30%
#     "rect:x,y,w,h"    — 절대 좌표 (px)
#
#   effect 옵션:
#     "brightness:0.5"       — 밝기 (1.0=원본, 0=검정, 2.0=2배)
#     "brightness:0.3 ~ 0.7" — 밝기 범위 랜덤
#     "saturation:1.5"       — 채도 (1.0=원본, 0=흑백)
#     "hue:0.1"              — 색조 회전 (0.0~1.0)
#     "blur:5"               — 가우시안 블러 (px)
#     "blur:3 ~ 8"           — 블러 범위 랜덤
#     "tint:R,G,B[,A]"       — 컬러 틴트 (A=0~255, 기본 128)
#     "tint:255,0,0,80 ~ 150" — 알파 범위 랜덤
#     "grayscale"            — 흑백
#
# ── quote (코어: QuoteBlock)
#   - quote: "인용문"
#   - quote: {text: "인용", attribution: "작가"}
#
# ── list (코어: ListBlock)
#   - list: [항목1, 항목2]
#
# ── divider (코어: DividerBlock)
#   - divider
#
# ── wait (블록 실행 후 대기)
#   - h2: "제목"
#     wait: 1s                        # 1초 대기
#   - image:
#       path: photo.jpg
#       wait: 2s                      # dict form 내부에도 가능
#   - paragraph: "프롬프트"
#     wait: 1s ~ 3s                   # 범위 랜덤
#
#   단위: s(초, 기본), ms(밀리초), m(분)
#   숫자만 쓰면 초 단위. 생략하면 대기 없음.
#
# ── when (조건부 블록)
#   - image: "a.jpg"
#     when: "{keyword:region} in [강남, 서초]"

# ═══════════════════════════════════════════════════════════
# assets (선택) — 이미지, 텍스트 파일 등의 베이스 디렉토리
# ═══════════════════════════════════════════════════════════
#
# assets: ./assets

# ═══════════════════════════════════════════════════════════
# exif_optimization (선택, 기본 true)
# ═══════════════════════════════════════════════════════════
#
# 모든 이미지에 카메라 EXIF 자동 삽입.
# exif_optimization: false  # 비활성화

# ═══════════════════════════════════════════════════════════
# publish (선택)
# ═══════════════════════════════════════════════════════════
#
# schedule: 'now' | 'now + 15m' | 'now + 1h' | 'now + 15m ~ 30m'
# schedule: '++'               # 순차 예약 (기본 15분 간격)
# schedule: '++ 15m'           # 순차 예약 (고정 15분 간격)
# schedule: '++ 15m ~ 30m'     # 순차 예약 (15~30분 랜덤 간격)

# ═══════════════════════════════════════════════════════════
# run (선택)
# ═══════════════════════════════════════════════════════════
#
# run:
#   interval: 60s
#   on_failure: stop              # stop | switch_account
#   on_resume: skip               # restart(기본) | skip
#   headless: true
#   parallel: true                # 계정별 병렬 실행 (기본 false)
#   max_workers: 3                # 동시 실행 계정 수 (기본 = 계정 수)
#
# on_resume 옵션:
#   restart  — 중단 후 재실행 시 처음부터 다시 (기본)
#   skip     — 완료된 조합은 건너뛰고 나머지만 실행
#
#   진행 기록은 workspace/progress/ 에 자동 저장됩니다.
