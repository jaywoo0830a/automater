# ── Campaign DSL Specification v6 ────────────────────────
#
# 원칙: 쓰는 게 곧 결과. 보이는 게 전부. 암묵적 동작 없음.

# ═══════════════════════════════════════════════════════════
# DSL 토큰 — 어디서든 동일하게 동작
# ═══════════════════════════════════════════════════════════
#
#   {keyword:slug}  — keywords[slug] 결정적 치환
#   {pool:slug}     — pools[slug] 랜덤 선택
#   {i}             — 1부터 시작하는 조합 인덱스

# ═══════════════════════════════════════════════════════════
# accounts (필수) — 최소 1개
# ═══════════════════════════════════════════════════════════
#
# accounts:
#   - username: id
#     password: pw
#     blog_id: myblog
#     session: my_session.json    # 명시 경로 (선택)

# ═══════════════════════════════════════════════════════════
# session_store (선택) — 세션 저장소
# ═══════════════════════════════════════════════════════════
#
# session_store: file                    # 기본: {username}_session.json
# session_store: redis://localhost:6379  # Redis TTL 24시간

# ═══════════════════════════════════════════════════════════
# titles (필수) — 제목 템플릿
# ═══════════════════════════════════════════════════════════
#
# titles:
#   - "{pool:prefix} {keyword:region} {keyword:subject} 과외"

# ═══════════════════════════════════════════════════════════
# keywords (필수) — 조합 = ∏(카테고리별 값 수) × titles 수
# ═══════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════
# pools (선택) — 매번 랜덤
# ═══════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════
# maps (선택) — 외부 YAML 파일 키:값 매핑
# ═══════════════════════════════════════════════════════════
#
# 맵 파일 (순수 데이터, maps/region_photo.yaml):
#   강남: gangnam.jpg
#   서초: seocho.jpg
#   _default: default.jpg
#
# 캠페인에서 참조:
#   maps:
#     photo:
#       file: maps/region_photo.yaml
#       by: "{keyword:region}"
#     link:
#       file: maps/region_link.yaml
#       by: "{keyword:region}"
#
# 사용: {map:photo}, {map:link} — 어디서든 토큰으로 사용
#   - image: {src: "{map:photo}", link: "{map:link}"}
#   - thumbnail: {src: "{map:photo}", link: "{map:link}"}

# ═══════════════════════════════════════════════════════════
# post (선택) — 블록 리스트
# ═══════════════════════════════════════════════════════════
#
# ── h1~h6 (소제목, 크기: H1=38 H2=34 H3=30 H4=28 H5=24 H6=19)
#   - h2: "{keyword:region} 소개"
#
# ── paragraph (값 = AI 프롬프트)
#   - paragraph: "{keyword:region} 과외를 소개해줘"
#
# ── image
#   - image: "{keyword:region}.jpg"
#   - image: {src: photo.jpg, alt: "{keyword:region} 외관"}
#   - image: {src: photo.jpg, link: "tel:01012345678"}
#
# ── thumbnail (대표 이미지)
#   - thumbnail: thumb.jpg
#   - thumbnail:
#       src: thumb.jpg
#       overlay: "{keyword:region} 과외"
#       link: "tel:01012345678"       # 이미지 클릭 시 URL (tel:, http:// 등)
#       color: "#FFD700"            # 텍스트 색상 (기본 #FFFFFF)
#       background: 0.6             # 반투명 배너 (0.0~1.0, 기본 0.0=없음)
#       position: bottom            # top / center / bottom (기본 center)
#       hue_shift: 0.03             # 색조 랜덤 회전 (±, 기본 0.03)
#       hue_shift: "0.1 ~ 0.3"     # 범위 문법: 조합마다 0.1~0.3 사이 랜덤
#       saturation_shift: "0.5 ~ 1.5"  # 채도 (기본 0.30)
#       brightness_shift: 0.05      # 밝기 (±, 기본 0.05)
#       brightness_shift: "0.05 ~ 0.15"  # 범위 문법
#       gps: [37.497, 127.027]      # GPS 좌표
#       filename: "gangnam-tutor"   # 파일명 키워드
#
# ── 기본 jitter (모든 이미지 공통, DSL 없이 자동 적용)
#   pixel_jitter: true     # 1~3 픽셀 RGB 미세 변경
#   size_jitter_px: 2      # ±2px 리사이즈
#   saturation_jitter: 0.03 (본문) / saturation_shift: 0.30 (썸네일)
#
# ── quote (인용구)
#   - quote: "인용문"
#   - quote: {text: "인용", by: "작가"}
#
# ── list
#   - list: [항목1, 항목2]
#
# ── divider (구분선)
#   - divider
#
# ── when (조건)
#   - image: "a.jpg"
#     when: "{keyword:region} in [강남, 서초]"

# ═══════════════════════════════════════════════════════════
# images (선택) — 이미지 베이스 디렉토리
# ═══════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════
# exif_optimization (선택, 기본 true)
# ═══════════════════════════════════════════════════════════
#
# 모든 이미지에 카메라 EXIF 자동 삽입:
# make, model, software, datetime, orientation, focal_length 등
#
# exif_optimization: false  # 비활성화

# ═══════════════════════════════════════════════════════════
# publish (선택)
# ═══════════════════════════════════════════════════════════
#
# schedule: 'now' | 'now + 15s' | 'now + 15m' | 'now + 1h' | 'now + 1d' | 'now + 15m ~ 30m'
# schedule: '++'               # 순차 예약 (기본 15분 간격)
# schedule: '++ 15m'           # 순차 예약 (고정 15분 간격)
# schedule: '++ 15m ~ 30m'     # 순차 예약 (15~30분 랜덤 간격)

# ═══════════════════════════════════════════════════════════
# run (선택)
# ═══════════════════════════════════════════════════════════
#
# run:
#   interval: 60s
#   max_daily: 10
#   on_failure: stop
#   headless: true
