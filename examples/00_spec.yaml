# ── Campaign DSL Specification v5 ────────────────────────
#
# 원칙: 쓰는 게 곧 결과. 보이는 게 전부. 암묵적 동작 없음.

# ═══════════════════════════════════════════════════════════
# DSL 토큰 — 어디서든 동일하게 동작
# ═══════════════════════════════════════════════════════════
#
#   {keyword:slug}  — keywords[slug] 결정적 치환
#   {pool:slug}     — pools[slug] 랜덤 선택
#   {i}             — 1부터 시작하는 조합 인덱스
#
# 토큰 밖은 리터럴.

# ═══════════════════════════════════════════════════════════
# accounts (필수) — 최소 1개. username, password 필수.
# ═══════════════════════════════════════════════════════════
#
# accounts:
#   - username: id
#     password: pw
#     blog_id: myblog

# ═══════════════════════════════════════════════════════════
# session_store (선택) — 세션 저장소
# ═══════════════════════════════════════════════════════════
#
# 기본값: file (JSON 파일, 현재 디렉토리)
#
# session_store: file
# session_store: redis://localhost:6379
#
# file: {username}_session.json 파일에 저장
# redis: session:{username} 키에 TTL 24시간으로 저장
#
# account에 session: path.json 명시하면 해당 경로 우선

# ═══════════════════════════════════════════════════════════
# titles (필수) — 한 줄 = 제목 한 변형
# ═══════════════════════════════════════════════════════════
#
# titles:
#   - "{pool:prefix} {keyword:region} {keyword:subject} 과외"

# ═══════════════════════════════════════════════════════════
# keywords (필수) — 조합 = ∏(카테고리별 값 수) × titles 줄 수
# ═══════════════════════════════════════════════════════════
#
# keywords:
#   region: [강남, 서초]
#   subject: [수학, 영어]

# ═══════════════════════════════════════════════════════════
# pools (선택) — 매번 랜덤
# ═══════════════════════════════════════════════════════════
#
# pools:
#   prefix: [검증된, 전문]

# ═══════════════════════════════════════════════════════════
# post (선택) — 블록 리스트
# ═══════════════════════════════════════════════════════════
#
# h1~h6:
#   - h2: "{keyword:region} {keyword:subject} 소개"
#
# paragraph: 값 = AI에 전달하는 프롬프트 그 자체
#   - paragraph: "{keyword:region} {keyword:subject} 과외를 소개해줘"
#   - paragraph: "{keyword:region}의 학원가 특징을 설명해줘"
#
# image / thumbnail: 경로에도 토큰 사용 가능
#   - image: "{keyword:region}.jpg"
#   - image: "{i}.jpg"
#   - image: {src: photo.jpg, alt: "{keyword:region} 외관"}
#   - thumbnail: {src: thumb.jpg, overlay: "{keyword:region} 과외"}
#
# list / quote / divider:
#   - list: [항목1, 항목2]
#   - quote: "인용문"
#   - divider
#
# ── when — 조건부 블록 ────────────────────────────────
#
#   - image: "{keyword:region}.jpg"
#     when: "{keyword:region} in [강남, 서초]"
#
#   - image: "default.jpg"
#     when: "{keyword:region} not in [강남, 서초]"
#
# 조건식: ==, !=, in [...], not in [...]
# when이 없으면 항상 포함.

# ═══════════════════════════════════════════════════════════
# images (선택) — 이미지 베이스 디렉토리
# ═══════════════════════════════════════════════════════════
#
# images: ./images

# ═══════════════════════════════════════════════════════════
# publish (선택) — 자유 키
# ═══════════════════════════════════════════════════════════
#
# schedule:
#   now                → 즉시 발행
#   now + 15s          → 15초 후
#   now + 15m          → 15분 후
#   now + 1h           → 1시간 후
#   now + 1d           → 1일 후
#   now + 30~60m       → 30~60분 사이 랜덤
#
# publish:
#   schedule: now + 15~30m
#   tags: [교육]
#   visibility: public

# ═══════════════════════════════════════════════════════════
# run (선택) — 자유 키. 시간: 60s, 5min, 1500ms
# ═══════════════════════════════════════════════════════════
#
# run:
#   interval: 60s
#   max_daily: 10
#   on_failure: stop
#   headless: true
