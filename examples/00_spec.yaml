# ── Campaign DSL Specification v3 ────────────────────────
#
# 이 파일은 파싱하지 않는다.
# DSL 문법의 유일한 정의서.
#
# 원칙: 쓰는 게 곧 결과. 보이는 게 전부.
# 핵심: 같은 토큰 문법이 어디서든 동일하게 동작한다.
#       암묵적 동작은 없다.

# ═══════════════════════════════════════════════════════════
# DSL 토큰
# ═══════════════════════════════════════════════════════════
#
# 세 종류. titles, post 어디서든 동일하게 동작.
#
#   {keyword:slug}  — keywords[slug]에서 결정적 치환.
#                     하나의 차원만 필요할 때.
#                     예: {keyword:region} → "강남"
#
#   {keywords}      — 전체 키워드를 정의 순서대로 합친 것.
#                     여러 차원을 한꺼번에 쓸 때의 명시적 단축형.
#                     예: region=강남, subject=수학 → "강남 수학"
#
#   {pool:slug}     — pools[slug]에서 매번 랜덤 선택.
#                     예: {pool:prefix} → "검증된" 또는 "전문"
#
# 토큰 밖의 텍스트는 리터럴. 공백도 그대로.

# ═══════════════════════════════════════════════════════════
# accounts (필수)
# ═══════════════════════════════════════════════════════════
#
# 최소 1개. username, password 만 필수.
# 나머지는 자유 — 플랫폼별로 다른 키를 쓴다.
# 계정 레벨 키는 글로벌 run 설정을 덮어쓴다.
#
# accounts:
#   - username: id
#     password: pw
#     blog_id: myblog
#     proxy: 1.2.3.4:8080
#     headless: false            # 계정 오버라이드

# ═══════════════════════════════════════════════════════════
# titles (필수)
# ═══════════════════════════════════════════════════════════
#
# 문자열 리스트. 한 줄이 곧 제목 한 변형.
# 스페이싱 = 문자열 자체.
#
# titles:
#   - "{pool:prefix} {keyword:region} {keyword:subject} 과외"
#   - "{pool:prefix} {keyword:region}{keyword:subject}과외"

# ═══════════════════════════════════════════════════════════
# keywords (필수)
# ═══════════════════════════════════════════════════════════
#
# slug → 값 리스트.
# 정의 순서가 {keywords} 합성 순서.
# 조합 수 = 각 카테고리 값 수의 곱 × titles 줄 수.
#
# keywords:
#   region: [강남, 서초, 잠실]
#   subject: [수학, 영어]

# ═══════════════════════════════════════════════════════════
# pools (선택)
# ═══════════════════════════════════════════════════════════
#
# slug → 값 리스트.
# {pool:slug}에서 매번 랜덤 선택.
# 안 쓰면 생략.
#
# pools:
#   prefix: [검증된, 전문]

# ═══════════════════════════════════════════════════════════
# post (선택)
# ═══════════════════════════════════════════════════════════
#
# 블록 리스트. 생략 시 기본 본문 생성.
# 각 항목: {블록타입: 값}
#
# 값 타입에 따라:
#   문자열     → 그 블록의 주요 필드
#   딕셔너리   → 전체 설정
#   없음       → 설정 없는 블록 (divider)
#
# ── 블록 타입 ─────────────────────────────────────────
#
# h1~h6:
#   - h2: "{keywords} 소개"
#
# paragraph:
#   - paragraph: "{keywords}"                              # 전체 키워드
#   - paragraph: "{keyword:region} {keyword:subject}"      # 개별 키워드
#   - paragraph: {keyword: "{keywords}", tone: review}     # 옵션 지정
#   - paragraph: {prompt: "자유 프롬프트"}                  # 직접 지정
#
# image:
#   - image: photo.jpg
#   - image: {src: photo.jpg, alt: "{keywords}"}
#
# thumbnail: (포스트당 최대 1개)
#   - thumbnail: thumb.jpg
#   - thumbnail: {src: thumb.jpg, overlay: "{keywords}"}
#
# list:
#   - list:
#     - 항목 1
#     - 항목 2
#
# quote:
#   - quote: "인용 텍스트"
#   - quote: {text: "인용", by: "출처"}
#
# divider:
#   - divider

# ═══════════════════════════════════════════════════════════
# images (선택)
# ═══════════════════════════════════════════════════════════
#
# 이미지 베이스 디렉토리. 생략 시 현재 디렉토리.
#
# images: ./images

# ═══════════════════════════════════════════════════════════
# publish (선택)
# ═══════════════════════════════════════════════════════════
#
# 자유 키. 소비자가 .get(key, default)로 읽는다.
# 생략 시 즉시 발행.
#
# schedule:
#   immediate       → 즉시
#   fixed HH:MM     → 지정 시각
#   random ±Nmin    → 기준 시각 ± N분 랜덤
#
# publish:
#   schedule: random ±30min
#   tags: [교육, 과외]
#   visibility: public

# ═══════════════════════════════════════════════════════════
# run (선택)
# ═══════════════════════════════════════════════════════════
#
# 자유 키. 생략 시 기본값.
# 시간: 60s, 5min, 1500ms
#
# run:
#   interval: 60s
#   max_daily: 10
#   on_failure: stop
#   headless: true

# ═══════════════════════════════════════════════════════════
# 조합 계산
# ═══════════════════════════════════════════════════════════
#
# total = (∏ keyword 카테고리별 값 수) × (titles 줄 수)
# 각 조합이 하나의 포스팅.
# accounts에 라운드 로빈 배분.
