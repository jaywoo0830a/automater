# ── Campaign DSL Specification v10 ───────────────────────
#
# 원칙: 쓰는 게 곧 결과. 보이는 게 전부. 암묵적 동작 없음.

# ═══════════════════════════════════════════════════════════
# DSL 토큰 -- 어디서든 동일하게 동작
# ═══════════════════════════════════════════════════════════
#
#   {keyword:slug}        -- keywords[slug] 결정적 치환
#   {pool:slug}           -- pools[slug] 랜덤 선택
#   {map:slug}            -- maps[slug] 룩업 결과
#   {i}                   -- 1부터 시작하는 조합 인덱스
#   {variation:name}      -- variations[name] 프로파일을 채워 삽입
#                            (각 축에서 무작위 1개 골라 template에 대입)
#   {variation:name.axis} -- 프로파일의 한 축에서만 무작위 1개 선택

# ═══════════════════════════════════════════════════════════
# platform (필수) -- 플랫폼 선언
# ═══════════════════════════════════════════════════════════
#
# platform: naver

# ═══════════════════════════════════════════════════════════
# browser (선택) -- 브라우저 환경 + 핑거프린트 위장
# ═══════════════════════════════════════════════════════════
#
# browser:
#   viewport: [1920, 1080]
#   user_agent: "Mozilla/5.0 ..."
#   locale: ko-KR
#   timezone: Asia/Seoul
#   color_scheme: light                       # light | dark
#   device_scale_factor: 1
#   geolocation: [37.497, 127.027]
#
#   fingerprint:
#     webdriver: false
#     plugins: true
#     chrome_runtime: true
#     languages: true
#
# 계정별 오버라이드:
#   accounts:
#     - username: id
#       browser:
#         viewport: [1440, 900]
#         geolocation: [37.517, 127.047]

# ═══════════════════════════════════════════════════════════
# accounts (필수) -- 인증 정보 + 분배 설정. 최소 1개
# ═══════════════════════════════════════════════════════════
#
# accounts:
#   - username: id
#     password: pw
#     blog_id: myblog
#     session: my_session.json          # 선택 (GUI에서는 자동 생성)
#     weight: 1                         # 분배 비율 (기본 1)
#     min_posts: 0                      # 최소 보장 (기본 0)
#     max_posts: 0                      # 상한 (기본 0 = 무제한)
#     proxy: 1.2.3.4:8080              # 프록시 (선택)
#
# 적용 순서: min_posts 보장 -> weight 비율 분배 -> max_posts 캡

# ═══════════════════════════════════════════════════════════
# keywords (필수) -- 조합 수 = 카테고리별 값 수의 곱 x 제목 수
# ═══════════════════════════════════════════════════════════
#
# keywords:
#   region: [강남, 서초, 잠실]
#   subject: [수학, 영어]

# ═══════════════════════════════════════════════════════════
# titles (필수) -- 제목 템플릿
# ═══════════════════════════════════════════════════════════
#
# titles:
#   - "{pool:prefix} {keyword:region} {keyword:subject} 과외"

# ═══════════════════════════════════════════════════════════
# pools (선택) -- 매번 랜덤 선택
# ═══════════════════════════════════════════════════════════
#
# pools:
#   prefix: [검증된, 전문, 추천]

# ═══════════════════════════════════════════════════════════
# variations (선택) -- AI 본문 구성 변형 프로파일
# ═══════════════════════════════════════════════════════════
#
# 같은 prompt를 매번 보내면 본문이 비슷해진다. variations는 도입/본론/마무리
# 같은 "구성 축"을 정의해두고, 매 콤보마다 각 축에서 한 가지를 무작위로 골라
# 프롬프트 끝에 작성 지침으로 끼워 넣는다.
#
# 같은 콤보 인덱스(combo.index)는 항상 같은 픽을 만들어내므로 재현 가능하다.
# 한 콤보 안에서 여러 paragraph가 같은 프로파일을 참조하면 콤보-시드 RNG가
# 진행되어 각 paragraph가 서로 다른 픽을 받는다.
#
# 형식:
#   variations:
#     blog_review:                          # 프로파일 이름 (자유)
#       axes:                               # 구성 축들 (필수)
#         intro:   ["장면 묘사", "독자 질문", "통계로 시작"]
#         body:    ["3가지 비교", "단계별 절차", "장단점 분석"]
#         closing: ["체크리스트", "한 줄 요약", "다음 행동 제안"]
#       template: |                         # 선택 — 생략 시 자동 포맷
#
#         [작성 지침 - 반드시 따를 것]
#         - 도입: {intro}
#         - 본론: {body}
#         - 마무리: {closing}
#
# 사용:
#   - paragraph: |
#       {keyword:region} {keyword:subject} 후기를 3000자 정도로 ...
#       {variation:blog_review}                       # 전체 템플릿 삽입
#
#   - paragraph: |
#       이번 단락은 {variation:blog_review.intro} 방식으로 시작.   # 한 축만
#
# template 규칙:
#   - 자리표시자는 axes에 정의된 축 이름만 허용 ({intro}, {body} 등)
#   - 템플릿 안의 {keyword:*} 같은 다른 DSL 토큰은 재귀 해석되지 않음
#     (변형 외부의 prompt 본문에서 사용할 것)
#
# template 생략 시 자동 포맷:
#
#     [작성 지침]
#     - intro: <pick>
#     - body: <pick>
#     - closing: <pick>

# ═══════════════════════════════════════════════════════════
# title_check (선택) -- 네이버 제목 중복 검사
# ═══════════════════════════════════════════════════════════
#
# 네이버 통합검색에서 동일 제목이 이미 노출되고 있으면
# pool을 재추첨하여 중복을 회피한다.
#
# 검색 전략:
#   - 검색 쿼리: 키워드 부분만 (pool 제외)
#   - 매칭 대상: 풀 타이틀 (키워드 + 후킹 문구)
#
# 동작 순서:
#   1. titles 템플릿에서 keyword만 추출 → 검색 쿼리
#      "{keyword:region} 중등 {keyword:subject}학원 {pool:hook}"
#      → 쿼리: "대치동 중등 수학학원"  (pool 제외)
#   2. Playwright 브라우저로 네이버 통합검색
#      https://search.naver.com/search.naver?query=대치동+중등+수학학원
#   3. 검색 결과에 풀 타이틀 "대치동 중등 수학학원 솔직 리뷰"가 있으면
#      → pool 재추첨 (seed 변경)
#   4. max_attempts까지 반복. 소진 시 마지막 제목 사용 + 경고
#
# 단축:
#   title_check: true                    # 기본값으로 활성화
#   title_check: false                   # 비활성화 (기본)
#
# 상세:
#   title_check:
#     max_attempts: 10                   # pool 재추첨 최대 횟수 (기본 10)
#     match: exact                       # exact | contains (기본 exact)
#     delay: 1s ~ 2s                     # 검색 요청 간 대기 (기본 1s ~ 2s)
#
# match 모드:
#   exact    — 공백 정규화 후 완전 일치
#   contains — 생성 제목이 검색 결과 제목에 포함되면 중복
#
# 제약:
#   - titles에 {pool:*} 토큰이 최소 1개 필요 (재추첨 대상)
#   - pool 조합 수 < max_attempts이면 경고
#   - Playwright 브라우저 재사용 (별도 HTTP 클라이언트 없음)
#
# 예시:
#   titles:
#     - "{keyword:region} 중등 {keyword:subject}학원 {pool:hook}"
#   pools:
#     hook: [솔직 리뷰, 학부모 후기, 실제 경험담, 추천 BEST, 비교 분석]
#   title_check: true
#
#   # 쿼리: "수월동 중등 수학학원" 으로 네이버 통합검색
#   # → 결과에 "수월동 중등 수학학원 솔직 리뷰" 존재 → 다음 hook으로
#   # → "수월동 중등 수학학원 학부모 후기" 재시도 → 미존재 → 확정

# ═══════════════════════════════════════════════════════════
# maps (선택) -- 외부 YAML 파일 키:값 매핑
# ═══════════════════════════════════════════════════════════
#
# 맵 파일 형식 (maps/region_photo.yaml):
#
#   1:1 매핑:
#     강남: gangnam.jpg
#     서초: seocho.jpg
#     _default: default.jpg
#
#   1:N 매핑 (YAML 리스트 -- 블록 자동 확장):
#     다산동: [다산점1.jpg, 다산점2.jpg, 다산점3.jpg]
#     _default: [default.jpg]
#
# 캠페인에서 참조:
#   maps:
#     photo:
#       file: maps/region_photo.yaml
#       by: "{keyword:region}"
#
# 사용:
#   - image: {path: "{map:photo}"}

# ═══════════════════════════════════════════════════════════
# post (선택) -- 블록 리스트
# ═══════════════════════════════════════════════════════════
#
# ── h1~h6 (소제목)
#   - h2: "{keyword:region} 소개"
#
# ── paragraph (AI 프롬프트 -> Gemini 생성, plain text 한 덩어리)
#   - paragraph: "{keyword:region} 과외를 소개해줘"
#
# ── ai_section (AI 1회 호출 -> 마크다운 파싱 -> 여러 블록)
#   사용자가 구조 가이드를 명시하면 AI가 마크다운으로 응답하고,
#   그 결과를 heading/list/quote/divider/text 블록으로 자동 변환한다.
#   AI 호출은 1회만 발생하며, 파싱된 텍스트는 TextBlock으로 매핑되어
#   추가 AI 호출 없이 그대로 삽입된다.
#
#   - ai_section:
#       prompt: "{keyword:region} 수학학원의 장점을 정리해줘"
#       structure:                # AI에게 주는 구조 가이드
#         - heading               # ## 소제목
#         - list                  # 글머리 기호 목록
#         - paragraph             # 일반 단락
#       on_mismatch: lenient      # lenient (기본) | strict
#                                 #   lenient: 파싱된 결과 그대로 사용
#                                 #   strict: structure와 정확히 일치해야 통과
#       auto_prompt: true         # 기본 true — structure를 프롬프트에 자동 추가
#                                 # false면 prompt를 그대로 AI에게 전달
#
#   structure 항목:
#     heading, h1~h6, list, ordered_list, quote, divider, paragraph, text
#
#   AI가 따르지 않을 가능성:
#     항목 개수, 순서, 추가/누락 등은 AI에 따라 다를 수 있다.
#     lenient 모드(기본)는 결과 그대로 사용한다.
#     일관성이 중요하면 on_mismatch: strict로 설정하여 실패 시 ConfigError로 처리한다.
#
# ── text (수동 텍스트 -- AI 없음)
#   인라인: - text: "{keyword:region} 중등 수학학원입니다."
#   파일:   - text:
#               file: "{i}.txt"
#               format: plain               # plain | html
#
# ── image
#   path 필수 -- 없거나 빈 값/'.'이면 ConfigError
#   단축: - image: photo.jpg
#   상세: - image:
#             path: photo.jpg              # 필수
#             alt: "대체텍스트"
#             link: "tel:01012345678"
#             wait: 3s
#             effects:
#               - region: border:10 ~ 30
#                 effect: brightness:0.3 ~ 0.7
#   토큰 사용: - image: {path: "{map:photo}"}
#             (토큰이 빈 값으로 치환되면 런타임에 ConfigError)
#
# ── featured_image (대표 이미지)
#   path 필수 -- image와 동일
#   단축: - featured_image: thumb.jpg
#   상세: - featured_image:
#             path: thumb.jpg              # 필수
#             overlay_text: "{keyword:region} 과외"
#             overlay_color: "#FFFFFF"
#             overlay_background: 0.6
#             overlay_position: bottom      # top | center | bottom
#             link: "tel:01012345678"
#             gps: [37.497, 127.027]
#             filename_keyword: "gangnam"
#             exif_description: "photo"
#             wait: 3s
#             effects:
#               - effect: hue:0.0 ~ 0.03
#               - effect: saturation:0.7 ~ 1.3
#               - region: border:5% ~ 15%
#                 effect: blur:3 ~ 8
#
# ── quote
#   단축: - quote: "인용문"                       # type=1 (기본)
#   상세: - quote:
#             text: "인용"
#             attribution: "작가"
#             type: 3                             # 1~6 (기본 1)
#
# ── list
#   단축: - list: [항목1, 항목2]
#   상세: - list:
#             items: [항목1, 항목2]
#             ordered: true
#
# ── divider
#   기본:    - divider                            # type=2 (기본)
#   숫자:    - divider: 5                         # 단축: 1~8
#   상세:    - divider:
#                type: 5                           # 1~8 (기본 2)
#
# ── newline (줄바꿈 -- 지정 횟수만큼 Enter)
#   - newline: 4                              # Enter 4번
#   - newline: 8                              # Enter 8번
#
# ── effects (image, featured_image 공통)
#
#   region:
#     all, border:20, border:10%, border:10 ~ 30,
#     center:60%, top:30%, bottom:30%, left:30%, right:30%,
#     rect:x,y,w,h
#
#   effect:
#     brightness:0.5, saturation:1.5, hue:0.1,
#     blur:5, tint:R,G,B[,A], grayscale
#     ~ 로 범위 랜덤: brightness:0.3 ~ 0.7
#
# ── layers (image, featured_image 공통)
#
#   원본 이미지 위에 AI 생성 이미지 / 정적 이미지 / 효과를 선언 순서대로 합성한다.
#   effects 보다 더 유연 — 레이어 간 순서를 자유롭게 조합할 수 있다.
#
#   공통 필드:
#     opacity: 0.0 ~ 1.0 (기본 1.0)
#     blend:   normal | multiply | screen | overlay  (기본 normal, 현재는 normal만 완전 구현)
#     fit:     cover | contain | stretch | tile      (기본 cover)
#
#   type: ai
#     prompt:   프롬프트 문자열 (DSL 토큰 가능) — 필수
#     model:    모델 ID (선택, 기본은 .env 의 TOGETHER_MODEL)
#     width:    생성 너비 (선택, 기본 base 이미지 크기)
#     height:   생성 높이 (선택)
#     seed:     고정 seed (선택, 생략 시 매번 새 이미지)
#
#   type: image
#     path:     정적 이미지 파일 경로 (DSL 토큰 가능) — 필수
#
#   type: effect
#     region:   all | border:... 등 (effects의 region과 동일)
#     effect:   grayscale | brightness:... 등 (effects의 effect와 동일)
#
#   예시:
#     - featured_image:
#         path: thumb.jpg
#         layers:
#           - type: ai                           # AI 이미지를 썸네일 위에 10% 로 깔기
#             prompt: "{keyword:region} aesthetic background"
#             opacity: 0.1
#           - type: effect                       # 그 위에 약간의 색감 효과
#             effect: "saturation:0.9 ~ 1.1"
#           - type: image                        # 마지막으로 워터마크 30%
#             path: watermark.png
#             opacity: 0.3
#             fit: contain
#
#   실패 정책:
#     AI 레이어: 네트워크/API 오류 시 해당 레이어 skip, 원본 유지
#     Image 레이어: 파일 없으면 skip
#
#   AI 이미지 서비스:
#     Together AI (FLUX.1-schnell 기본, ~$0.003/장) 사용.
#     TOGETHER_API_KEY 환경변수 필수 — 없으면 AI 레이어는 skip 되고 원본 유지.
#     모델은 .env 의 TOGETHER_MODEL 로 변경 가능.
#
# ── wait (블록 실행 후 대기)
#   - h2: "제목"
#     wait: 1s
#   - image:
#       path: photo.jpg
#       wait: 2s ~ 3s                       # 범위 랜덤
#   단위: s(초), ms(밀리초), m(분)
#
# ── when (조건부 블록)
#   - image: "a.jpg"
#     when: "{keyword:region} in [강남, 서초]"
#   - image: "default.jpg"
#     when: "{keyword:region} not in [강남, 서초]"
#   조건: ==, !=, in [...], not in [...]

# ═══════════════════════════════════════════════════════════
# style (선택) -- 글 전체 스타일
# ═══════════════════════════════════════════════════════════
#
# style:
#   align: center                            # left | center | right (기본 left)

# ═══════════════════════════════════════════════════════════
# assets (선택) -- 이미지, 텍스트 등 베이스 디렉토리
# ═══════════════════════════════════════════════════════════
#
# assets: ./assets

# ═══════════════════════════════════════════════════════════
# exif_optimization (선택, 기본 true)
# ═══════════════════════════════════════════════════════════
#
# exif_optimization: false

# ═══════════════════════════════════════════════════════════
# publish (선택)
# ═══════════════════════════════════════════════════════════
#
# publish:
#   schedule: now                            # 즉시
#   schedule: now + 15m                      # 15분 후
#   schedule: now + 15m ~ 30m                # 15~30분 랜덤
#   schedule: ++                             # 순차 (15분 간격, 지금부터)
#   schedule: ++ 15m                         # 순차 (고정)
#   schedule: ++ 15m ~ 30m                   # 순차 (랜덤 간격)
#   schedule: ++ 15m from +1d               # 내일부터 순차 (고정)
#   schedule: ++ 15m from +1d 09:00         # 내일 9시부터 순차
#   schedule: ++ 15m ~ 30m from +1d 09:00   # 내일 9시부터 순차 (랜덤)
#   schedule: ++ 15m from 2026-04-14 09:00  # 절대 시각부터 순차
#   tags: [교육, 과외]
#   visibility: public                       # public | private

# ═══════════════════════════════════════════════════════════
# run (선택)
# ═══════════════════════════════════════════════════════════
#
# run:
#   interval: 60s                            # 포스트 간 대기
#   on_failure: continue                     # continue (기본) | stop
#                                            #   continue: 실패해도 다음 combo 계속
#                                            #   stop: 첫 실패 즉시 캠페인 전체 중단
#   on_resume: restart                       # restart | skip
#   headless: true                           # CLI 인자로만 동작 (--headless)
#   parallel: false                          # 계정별 병렬
#   max_workers: 3                           # parallel=true 시
#
# ═══════════════════════════════════════════════════════════
# notify (선택) -- 실패 즉시 알림 + 캠페인 완료 요약
# ═══════════════════════════════════════════════════════════
#
# notify:
#   on: always                               # always | complete | fail
#   channels:
#     - type: telegram
#       token: "123456:ABC-DEF..."           # Bot API token
#       chat_id: "987654321"                 # 채팅 ID
#
# 알림 종류 2가지
# ----------------
# 1. 실시간 실패 알림 — 각 combo 실패 시 즉시 전송
#    on=always 또는 on=fail일 때 전송
#    내용: 계정, 진행도(1/40), 조합 키워드, 제목, 전체 에러 메시지
#
# 2. 완료 요약 알림 — 캠페인 종료 시 1회 전송
#    on에 따라 다름:
#      always: 항상
#      fail:    실패 있을 때만
#      complete: 실패 없을 때만 (전 성공)
#    내용: 성공/실패 combo 전체 나열 (조합 키워드 + 제목 + 에러)
#    트렁케이션 없음 — 모든 combo 표시
#
# 권장 조합:
#   run:
#     on_failure: stop        # 첫 실패 즉시 중단
#   notify:
#     on: always              # 실패 즉시 알림 + 완료 요약 모두
#     channels: [...]

