# ── Campaign DSL Specification v10 ───────────────────────
#
# 원칙: 쓰는 게 곧 결과. 보이는 게 전부. 암묵적 동작 없음.

# ═══════════════════════════════════════════════════════════
# DSL 토큰 -- 어디서든 동일하게 동작
# ═══════════════════════════════════════════════════════════
#
#   {keyword:slug}  -- keywords[slug] 결정적 치환
#   {pool:slug}     -- pools[slug] 랜덤 선택
#   {map:slug}      -- maps[slug] 룩업 결과
#   {i}             -- 1부터 시작하는 조합 인덱스

# ═══════════════════════════════════════════════════════════
# platform (필수) -- 플랫폼 선언
# ═══════════════════════════════════════════════════════════
#
# platform: naver

# ═══════════════════════════════════════════════════════════
# browser (선택) -- 브라우저 환경 + 핑거프린트 위장
# ═══════════════════════════════════════════════════════════
#
# browser:
#   viewport: [1920, 1080]
#   user_agent: "Mozilla/5.0 ..."
#   locale: ko-KR
#   timezone: Asia/Seoul
#   color_scheme: light                       # light | dark
#   device_scale_factor: 1
#   geolocation: [37.497, 127.027]
#
#   fingerprint:
#     webdriver: false
#     plugins: true
#     chrome_runtime: true
#     languages: true
#
# 계정별 오버라이드:
#   accounts:
#     - username: id
#       browser:
#         viewport: [1440, 900]
#         geolocation: [37.517, 127.047]

# ═══════════════════════════════════════════════════════════
# accounts (필수) -- 인증 정보 + 분배 설정. 최소 1개
# ═══════════════════════════════════════════════════════════
#
# accounts:
#   - username: id
#     password: pw
#     blog_id: myblog
#     session: my_session.json          # 선택 (GUI에서는 자동 생성)
#     weight: 1                         # 분배 비율 (기본 1)
#     min_posts: 0                      # 최소 보장 (기본 0)
#     max_posts: 0                      # 상한 (기본 0 = 무제한)
#     proxy: 1.2.3.4:8080              # 프록시 (선택)
#
# 적용 순서: min_posts 보장 -> weight 비율 분배 -> max_posts 캡

# ═══════════════════════════════════════════════════════════
# keywords (필수) -- 조합 수 = 카테고리별 값 수의 곱 x 제목 수
# ═══════════════════════════════════════════════════════════
#
# keywords:
#   region: [강남, 서초, 잠실]
#   subject: [수학, 영어]

# ═══════════════════════════════════════════════════════════
# titles (필수) -- 제목 템플릿
# ═══════════════════════════════════════════════════════════
#
# titles:
#   - "{pool:prefix} {keyword:region} {keyword:subject} 과외"

# ═══════════════════════════════════════════════════════════
# pools (선택) -- 매번 랜덤 선택
# ═══════════════════════════════════════════════════════════
#
# pools:
#   prefix: [검증된, 전문, 추천]

# ═══════════════════════════════════════════════════════════
# title_check (선택) -- 네이버 제목 중복 검사
# ═══════════════════════════════════════════════════════════
#
# 네이버 통합검색에서 동일 제목이 이미 노출되고 있으면
# pool을 재추첨하여 중복을 회피한다.
#
# 검색 전략:
#   - 검색 쿼리: 키워드 부분만 (pool 제외)
#   - 매칭 대상: 풀 타이틀 (키워드 + 후킹 문구)
#
# 동작 순서:
#   1. titles 템플릿에서 keyword만 추출 → 검색 쿼리
#      "{keyword:region} 중등 {keyword:subject}학원 {pool:hook}"
#      → 쿼리: "대치동 중등 수학학원"  (pool 제외)
#   2. Playwright 브라우저로 네이버 통합검색
#      https://search.naver.com/search.naver?query=대치동+중등+수학학원
#   3. 검색 결과에 풀 타이틀 "대치동 중등 수학학원 솔직 리뷰"가 있으면
#      → pool 재추첨 (seed 변경)
#   4. max_attempts까지 반복. 소진 시 마지막 제목 사용 + 경고
#
# 단축:
#   title_check: true                    # 기본값으로 활성화
#   title_check: false                   # 비활성화 (기본)
#
# 상세:
#   title_check:
#     max_attempts: 10                   # pool 재추첨 최대 횟수 (기본 10)
#     match: exact                       # exact | contains (기본 exact)
#     delay: 1s ~ 2s                     # 검색 요청 간 대기 (기본 1s ~ 2s)
#
# match 모드:
#   exact    — 공백 정규화 후 완전 일치
#   contains — 생성 제목이 검색 결과 제목에 포함되면 중복
#
# 제약:
#   - titles에 {pool:*} 토큰이 최소 1개 필요 (재추첨 대상)
#   - pool 조합 수 < max_attempts이면 경고
#   - Playwright 브라우저 재사용 (별도 HTTP 클라이언트 없음)
#
# 예시:
#   titles:
#     - "{keyword:region} 중등 {keyword:subject}학원 {pool:hook}"
#   pools:
#     hook: [솔직 리뷰, 학부모 후기, 실제 경험담, 추천 BEST, 비교 분석]
#   title_check: true
#
#   # 쿼리: "수월동 중등 수학학원" 으로 네이버 통합검색
#   # → 결과에 "수월동 중등 수학학원 솔직 리뷰" 존재 → 다음 hook으로
#   # → "수월동 중등 수학학원 학부모 후기" 재시도 → 미존재 → 확정

# ═══════════════════════════════════════════════════════════
# maps (선택) -- 외부 YAML 파일 키:값 매핑
# ═══════════════════════════════════════════════════════════
#
# 맵 파일 형식 (maps/region_photo.yaml):
#
#   1:1 매핑:
#     강남: gangnam.jpg
#     서초: seocho.jpg
#     _default: default.jpg
#
#   1:N 매핑 (YAML 리스트 -- 블록 자동 확장):
#     다산동: [다산점1.jpg, 다산점2.jpg, 다산점3.jpg]
#     _default: [default.jpg]
#
# 캠페인에서 참조:
#   maps:
#     photo:
#       file: maps/region_photo.yaml
#       by: "{keyword:region}"
#
# 사용:
#   - image: {path: "{map:photo}"}

# ═══════════════════════════════════════════════════════════
# post (선택) -- 블록 리스트
# ═══════════════════════════════════════════════════════════
#
# ── h1~h6 (소제목)
#   - h2: "{keyword:region} 소개"
#
# ── paragraph (AI 프롬프트 -> Gemini 생성)
#   - paragraph: "{keyword:region} 과외를 소개해줘"
#
# ── text (수동 텍스트 -- AI 없음)
#   인라인: - text: "{keyword:region} 중등 수학학원입니다."
#   파일:   - text:
#               file: "{i}.txt"
#               format: plain               # plain | html
#
# ── image
#   path 필수 -- 없거나 빈 값/'.'이면 ConfigError
#   단축: - image: photo.jpg
#   상세: - image:
#             path: photo.jpg              # 필수
#             alt: "대체텍스트"
#             link: "tel:01012345678"
#             wait: 3s
#             effects:
#               - region: border:10 ~ 30
#                 effect: brightness:0.3 ~ 0.7
#   토큰 사용: - image: {path: "{map:photo}"}
#             (토큰이 빈 값으로 치환되면 런타임에 ConfigError)
#
# ── featured_image (대표 이미지)
#   path 필수 -- image와 동일
#   단축: - featured_image: thumb.jpg
#   상세: - featured_image:
#             path: thumb.jpg              # 필수
#             overlay_text: "{keyword:region} 과외"
#             overlay_color: "#FFFFFF"
#             overlay_background: 0.6
#             overlay_position: bottom      # top | center | bottom
#             link: "tel:01012345678"
#             gps: [37.497, 127.027]
#             filename_keyword: "gangnam"
#             exif_description: "photo"
#             wait: 3s
#             effects:
#               - effect: hue:0.0 ~ 0.03
#               - effect: saturation:0.7 ~ 1.3
#               - region: border:5% ~ 15%
#                 effect: blur:3 ~ 8
#
# ── quote
#   단축: - quote: "인용문"                       # type=1 (기본)
#   상세: - quote:
#             text: "인용"
#             attribution: "작가"
#             type: 3                             # 1~6 (기본 1)
#
# ── list
#   단축: - list: [항목1, 항목2]
#   상세: - list:
#             items: [항목1, 항목2]
#             ordered: true
#
# ── divider
#   기본:    - divider                            # type=2 (기본)
#   숫자:    - divider: 5                         # 단축: 1~8
#   상세:    - divider:
#                type: 5                           # 1~8 (기본 2)
#
# ── newline (줄바꿈 -- 지정 횟수만큼 Enter)
#   - newline: 4                              # Enter 4번
#   - newline: 8                              # Enter 8번
#
# ── effects (image, featured_image 공통)
#
#   region:
#     all, border:20, border:10%, border:10 ~ 30,
#     center:60%, top:30%, bottom:30%, left:30%, right:30%,
#     rect:x,y,w,h
#
#   effect:
#     brightness:0.5, saturation:1.5, hue:0.1,
#     blur:5, tint:R,G,B[,A], grayscale
#     ~ 로 범위 랜덤: brightness:0.3 ~ 0.7
#
# ── wait (블록 실행 후 대기)
#   - h2: "제목"
#     wait: 1s
#   - image:
#       path: photo.jpg
#       wait: 2s ~ 3s                       # 범위 랜덤
#   단위: s(초), ms(밀리초), m(분)
#
# ── when (조건부 블록)
#   - image: "a.jpg"
#     when: "{keyword:region} in [강남, 서초]"
#   - image: "default.jpg"
#     when: "{keyword:region} not in [강남, 서초]"
#   조건: ==, !=, in [...], not in [...]

# ═══════════════════════════════════════════════════════════
# style (선택) -- 글 전체 스타일
# ═══════════════════════════════════════════════════════════
#
# style:
#   align: center                            # left | center | right (기본 left)

# ═══════════════════════════════════════════════════════════
# assets (선택) -- 이미지, 텍스트 등 베이스 디렉토리
# ═══════════════════════════════════════════════════════════
#
# assets: ./assets

# ═══════════════════════════════════════════════════════════
# exif_optimization (선택, 기본 true)
# ═══════════════════════════════════════════════════════════
#
# exif_optimization: false

# ═══════════════════════════════════════════════════════════
# publish (선택)
# ═══════════════════════════════════════════════════════════
#
# publish:
#   schedule: now                            # 즉시
#   schedule: now + 15m                      # 15분 후
#   schedule: now + 15m ~ 30m                # 15~30분 랜덤
#   schedule: ++                             # 순차 (15분 간격)
#   schedule: ++ 15m                         # 순차 (고정)
#   schedule: ++ 15m ~ 30m                   # 순차 (랜덤 간격)
#   tags: [교육, 과외]
#   visibility: public                       # public | private

# ═══════════════════════════════════════════════════════════
# run (선택)
# ═══════════════════════════════════════════════════════════
#
# run:
#   interval: 60s                            # 포스트 간 대기
#   on_failure: stop                         # (미구현) stop | switch_account
#   on_resume: restart                       # restart | skip
#   headless: true                           # CLI 인자로만 동작 (--headless)
#   parallel: false                          # 계정별 병렬
#   max_workers: 3                           # parallel=true 시
#
# ═══════════════════════════════════════════════════════════
# notify (선택) -- 캠페인 완료 시 알림
# ═══════════════════════════════════════════════════════════
#
# notify:
#   on: always                               # complete | fail | always
#   channels:
#     - type: telegram
#       token: "123456:ABC-DEF..."           # Bot API token
#       chat_id: "987654321"                 # 채팅 ID
#
# 알림 내용: 캠페인명, 성공/실패 수, 오류 요약

# ═══════════════════════════════════════════════════════════
# CLI
# ═══════════════════════════════════════════════════════════
#
#   python -m cli campaign.yaml --validate
#   python -m cli campaign.yaml --prepare
#   python -m cli campaign.yaml --preview
#   python -m cli campaign.yaml
#   python -m cli campaign.yaml --execute
#   python -m cli campaign.yaml --execute --resume
