# ── Campaign DSL Specification v4 ────────────────────────
#
# 이 파일은 파싱하지 않는다.
# DSL 문법의 유일한 정의서.
#
# 원칙: 쓰는 게 곧 결과. 보이는 게 전부.
#       암묵적 동작은 없다.

# ═══════════════════════════════════════════════════════════
# DSL 토큰
# ═══════════════════════════════════════════════════════════
#
# 세 종류. titles, post 어디서든 동일하게 동작.
#
#   {keyword:slug}  — keywords[slug]에서 결정적 치환.
#   {keywords}      — 전체 키워드를 정의 순서대로 합친 것.
#   {pool:slug}     — pools[slug]에서 매번 랜덤 선택.
#
# 토큰 밖의 텍스트는 리터럴.

# ═══════════════════════════════════════════════════════════
# accounts (필수)
# ═══════════════════════════════════════════════════════════
#
# 최소 1개. username, password 만 필수. 나머지 자유.
#
# accounts:
#   - username: id
#     password: pw
#     blog_id: myblog
#     proxy: 1.2.3.4:8080
#     headless: false

# ═══════════════════════════════════════════════════════════
# titles (필수)
# ═══════════════════════════════════════════════════════════
#
# 문자열 리스트. 한 줄이 곧 제목 한 변형.
#
# titles:
#   - "{pool:prefix} {keywords} 과외 {pool:suffix}"
#   - "{pool:prefix} {keyword:region}{keyword:subject}과외"

# ═══════════════════════════════════════════════════════════
# keywords (필수)
# ═══════════════════════════════════════════════════════════
#
# slug → 값 리스트. 정의 순서 = {keywords} 합성 순서.
# 조합 수 = ∏(카테고리별 값 수) × titles 줄 수.
#
# keywords:
#   region: [강남, 서초, 잠실]
#   subject: [수학, 영어]

# ═══════════════════════════════════════════════════════════
# pools (선택)
# ═══════════════════════════════════════════════════════════
#
# slug → 값 리스트. {pool:slug}에서 매번 랜덤 선택.
#
# pools:
#   prefix: [검증된, 전문]

# ═══════════════════════════════════════════════════════════
# post (선택)
# ═══════════════════════════════════════════════════════════
#
# 블록 리스트. 각 항목: {블록타입: 값}
#
# ── 블록 타입 ─────────────────────────────────────────
#
# h1~h6: 제목
#   - h2: "{keywords} 소개"
#
# paragraph: AI 생성 텍스트 — 값이 곧 프롬프트.
#   DSL 토큰으로 키워드를 프롬프트 안에 직접 넣는다.
#   필요한 지시사항(톤, 글자 수, 횟수 등)을 전부 프롬프트에 쓴다.
#
#   - paragraph: "{keywords} 과외를 소개하는 글을 써줘"
#   - paragraph: "{keywords} 과외 후기를 학부모 톤으로 300자 이상 써줘"
#   - paragraph: "{keyword:region}의 학원가 특징을 설명해줘"
#   - paragraph: "{keywords}가 4번 언급되는 글을 써줘. 3500자 이상"
#
# image: 본문 이미지
#   - image: photo.jpg
#   - image: {src: photo.jpg, alt: "{keywords}"}
#
# thumbnail: 대표 이미지 (최대 1개)
#   - thumbnail: thumb.jpg
#   - thumbnail: {src: thumb.jpg, overlay: "{keywords}"}
#
# list: 목록
#   - list:
#     - 항목 1
#     - 항목 2
#
# quote: 인용문
#   - quote: "인용 텍스트"
#   - quote: {text: "인용", by: "출처"}
#
# divider: 구분선
#   - divider

# ═══════════════════════════════════════════════════════════
# images (선택)
# ═══════════════════════════════════════════════════════════
#
# 이미지 베이스 디렉토리. 생략 시 현재 디렉토리.
#
# images: ./images

# ═══════════════════════════════════════════════════════════
# publish (선택)
# ═══════════════════════════════════════════════════════════
#
# 자유 키. 생략 시 즉시 발행.
#
# publish:
#   schedule: random ±30min
#   tags: [교육, 과외]
#   visibility: public

# ═══════════════════════════════════════════════════════════
# run (선택)
# ═══════════════════════════════════════════════════════════
#
# 자유 키. 생략 시 기본값.
#
# run:
#   interval: 60s
#   max_daily: 10
#   on_failure: stop
#   headless: true
