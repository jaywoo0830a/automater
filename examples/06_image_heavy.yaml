# ── 이미지 중심 캠페인 ───────────────────────────────────

accounts:
  - username: photo_blog
    password: pw1
    blog_id: photoblog

titles:
  - "{pool:hook} {keyword:region} {keyword:category} 베스트 {pool:count}"

keywords:
  region: [강남, 홍대, 이태원]
  category: [브런치, 디저트, 와인바]

pools:
  hook: [요즘 핫한, 현지인 추천, 숨은 명소]
  count: [TOP 5, TOP 7, BEST 10]

post:
  - thumbnail:
      src: cover.jpg
      overlay: "{keyword:region} {keyword:category}"
      link: "https://map.naver.com"
      color: "#FFFFFF"
      background: 0.6
      position: bottom
      gps: [37.517, 127.047]
  - h2: "{keyword:region} {keyword:category} 소개"
  - paragraph: "{keyword:region} {keyword:category}를 소개하는 글을 300자 이상 써줘"
  - image: {src: photo_1.jpg, alt: "{keyword:region} {keyword:category} 외관"}
  - paragraph: "{keyword:region} {keyword:category}의 대표 메뉴를 리뷰해줘"
  - image: {src: photo_2.jpg, alt: "{keyword:region} {keyword:category} 메뉴"}
  - paragraph: "{keyword:region} {keyword:category}의 분위기와 서비스를 리뷰해줘"
  - divider
  - h3: "방문 팁"
  - list:
    - 주차는 근처 공영주차장 이용
    - 예약 필수 (특히 주말)
    - 런치 세트가 가성비 좋음
  - divider
  - paragraph: "{keyword:region} {keyword:category}를 추천하며 마무리해줘. 방문 유도 톤"

images: ./photos

publish:
  schedule: 'now + 30m ~ 60m'
  tags: [맛집, 카페, 핫플]

run:
  interval: 90s
  max_daily: 8
  headless: true
  upload_delay: 2000ms
