# ── 풀 캠페인 ───────────────────────────────────────────
# 모든 주요 기능을 포함하는 종합 예제.

platform: naver

browser:
  viewport: [1920, 1080]
  locale: ko-KR
  timezone: Asia/Seoul
  geolocation: [37.497, 127.027]
  fingerprint:
    webdriver: false
    plugins: true
    chrome_runtime: true
    languages: true

accounts:
  - username: naver_id_1
    password: pw1
    blog_id: myblog1
    session: naver_id_1_session.json

  - username: naver_id_2
    password: pw2
    blog_id: myblog2

titles:
  - "{pool:prefix} {keyword:region} {keyword:subject} 과외 {pool:suffix}"
  - "{pool:prefix} {keyword:region}{keyword:subject}과외 {pool:suffix}"

keywords:
  region: [강남, 서초, 잠실]
  subject: [수학, 영어]

pools:
  prefix: [검증된, 전문, 추천]
  suffix: [강력 추천, 즉시 가능]

# ── variations: 본문 구성 다양화 프로파일 ──
# 같은 프롬프트를 반복 호출하면 본문이 단조로워진다.
# 매 콤보마다 각 축에서 1개씩 뽑아 작성 지침으로 끼워 넣는다.
variations:
  review:
    axes:
      intro:   ["구체적인 장면 묘사로 시작", "독자가 흔히 겪는 상황 질문으로 시작",
                "관련 통계나 숫자로 시작", "흔한 오해를 짚고 반박하며 시작"]
      body:    ["3가지를 비교하는 형식", "단계별 절차(1→2→3)로 풀기",
                "장점/단점/주의점으로 나눠서", "사례 하나를 깊이 분석하고 교훈 도출"]
      closing: ["체크리스트로 마무리", "한 줄 핵심 요약으로 닫기",
                "독자가 바로 시도할 다음 행동 제안"]
    template: |

      [작성 지침 - 반드시 따를 것]
      - 도입: {intro}
      - 본론: {body}
      - 마무리: {closing}

title_check: true

post:
  - h2: "{keyword:region} {keyword:subject} 과외 소개"
  - paragraph: |
      {keyword:region} {keyword:subject} 과외를 자연스럽게 소개해줘.
      {variation:review}
  - image:
      path: body.jpg
      link: "tel:01012345678"
      wait: 3s
  - quote:
      text: "교육은 미래를 여는 열쇠다"
      type: 2                             # 인용구 스타일 1~6
  - text: "{keyword:region}에서 검증된 {keyword:subject} 과외 전문 선생님이 직접 지도합니다."

  # ── ai_section: 1회 AI 호출로 구조화된 섹션 자동 생성 ──
  - ai_section:
      prompt: "{keyword:region} {keyword:subject} 과외의 장점을 학부모 관점에서 정리해줘"
      structure:
        - heading
        - list
        - paragraph
      on_mismatch: lenient                # lenient (기본) | strict
      auto_prompt: true                    # structure 가이드를 프롬프트에 자동 추가

  - divider: 5                            # 구분선 스타일 1~8 (기본 2)
  - paragraph: |
      {keyword:region} {keyword:subject} 과외 홍보 마무리. 행동 유도 포함.
      {variation:review}
  - featured_image:
      path: thumb.jpg
      link: "tel:01012345678"
      overlay_text: "{keyword:region} {keyword:subject} 과외"
      overlay_color: "#FFFFFF"
      overlay_background: 0.5
      overlay_position: bottom
      # AI 이미지를 10%만 얹어 디테일 살짝 입히고, 그 위에 색감 효과 적용
      layers:
        - type: ai
          prompt: "{keyword:region} {keyword:subject} study aesthetic, soft warm light"
          opacity: 0.1
        - type: effect
          effect: "hue:0.0 ~ 0.03"
        - type: effect
          effect: "saturation:0.7 ~ 1.3"
        - type: effect
          effect: "brightness:0.95 ~ 1.05"
      wait: 3s

style:
  align: center

assets: ./images

publish:
  schedule: 'now + 15m ~ 30m'
  tags: [교육, 과외, 학원]
  visibility: public

run:
  interval: 60s
  on_failure: stop                        # 첫 실패 즉시 캠페인 전체 중단
                                          # continue: 실패해도 다음 combo 계속 (기본)
  on_resume: restart                      # restart | skip
  headless: true

# ── 알림: 실시간 실패 + 완료 요약 ──
notify:
  on: always                              # always: 실패 즉시 + 완료 요약
                                          # fail:    실패 있을 때만 요약 (실시간 실패 포함)
                                          # complete: 성공 완료 시에만 (실패 알림 안 보냄)
  channels:
    - type: telegram
      token: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
      chat_id: "987654321"
