# ── 텍스트 전용 캠페인 ───────────────────────────────────

accounts:
  - username: writer1
    password: pw1
    blog_id: textblog

titles:
  - "{keyword:city} {keyword:topic} 완벽 가이드"

keywords:
  city: [서울, 부산, 제주]
  topic: [맛집, 카페, 관광지]

post:
  - h2: "{keyword:city} {keyword:topic} 소개"
  - paragraph: "{keyword:city} {keyword:topic}에 대해 정보 전달 위주로 소개해줘"
  - paragraph: "{keyword:city} {keyword:topic}을 직접 방문한 경험담을 1인칭으로 써줘"
  - quote: "여행은 살아있는 교육이다"
  - paragraph: "{keyword:city} {keyword:topic} 여행의 감성을 이야기 형식으로 써줘"
  - divider
  - h3: "마무리"
  - paragraph: "{keyword:city} {keyword:topic}을 추천하며 마무리해줘. 행동 유도 포함"

publish:
  schedule: now
  tags: [여행, 관광, 맛집]

run:
  interval: 30s
  max_daily: 20
  headless: true
