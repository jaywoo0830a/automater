# ── 이미지 중심 캠페인 ───────────────────────────────────

accounts:
  - username: photo_blog
    password: pw1
    blog_id: photoblog

titles:
  - "{pool:hook} {keywords} 베스트 {pool:count}"

keywords:
  region: [강남, 홍대, 이태원]
  category: [브런치, 디저트, 와인바]

pools:
  hook: [요즘 핫한, 현지인 추천, 숨은 명소]
  count: [TOP 5, TOP 7, BEST 10]

post:
  - thumbnail: {src: cover.jpg, overlay: "{keywords}"}
  - h2: "{keywords} 소개"
  - paragraph: "{keywords}를 소개하는 글을 300자 이상 써줘"
  - image: {src: photo_1.jpg, alt: "{keywords} 외관"}
  - paragraph: "{keywords}의 대표 메뉴를 리뷰해줘"
  - image: {src: photo_2.jpg, alt: "{keywords} 메뉴"}
  - paragraph: "{keywords}의 분위기와 서비스를 리뷰해줘"
  - image: {src: photo_3.jpg, alt: "{keywords} 분위기"}
  - h3: "방문 팁"
  - list:
    - 주차는 근처 공영주차장 이용
    - 예약 필수 (특히 주말)
    - 런치 세트가 가성비 좋음
  - divider
  - paragraph: "{keywords}를 추천하며 마무리해줘. 방문을 유도하는 톤으로"

images: ./photos

publish:
  schedule: random ±60min
  tags: [맛집, 카페, 핫플]
  visibility: public

run:
  interval: 90s
  max_daily: 8
  headless: true
  upload_delay: 2000ms
