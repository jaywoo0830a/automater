# ── 개별 키워드 활용 ─────────────────────────────────────
# 프롬프트 안에서 지역·과목을 따로 참조하는 경우.

accounts:
  - username: edu_blog
    password: pw1
    blog_id: edublog

titles:
  - "{keyword:region}에서 {keyword:subject} 배우기 — {pool:hook}"

keywords:
  region: [강남, 서초, 목동]
  subject: [수학, 영어, 코딩]

pools:
  hook: [전문가 추천, 학부모 후기, 성적 보장]

post:
  - h2: "{keyword:region} {keyword:subject} 과외"
  - paragraph: "{keyword:subject} 과외를 {keyword:region}에서 찾고 계신가요? 자연스러운 도입부를 써줘"
  - paragraph: "{keywords} 과외에 대해 소개해줘"
  - image: body.jpg
  - h3: "{keyword:region} 학원가 특징"
  - paragraph: "{keyword:region} 지역의 학원가 특징과 교육 환경을 설명해줘"
  - h3: "{keyword:subject} 학습 전략"
  - paragraph: "{keyword:subject} 학습 전략과 효과적인 공부법을 리뷰 형식으로 써줘"
  - divider
  - paragraph: "{keywords} 과외를 추천하며 마무리해줘. 상담 신청을 유도하는 톤으로"
  - thumbnail: {src: thumb.jpg, overlay: "{keywords} 과외"}

images: ./images

publish:
  schedule: random ±30min
  tags: [교육, 과외]
  visibility: public

run:
  interval: 60s
  max_daily: 10
  headless: true
