# ── 트리 키워드 캠페인 ──────────────────────────────────
# 부모 dimension(region)에 따라 자식 dimension(district)의 후보가 달라지는
# 캠페인. 평면 키워드 하나만 쓸 때 cartesian product가 되는 것과 달리,
# 트리 키워드는 부모 값별로 자식을 펼쳐 콤보를 만든다.
#
# 예시 콤보:
#   (강남, 대치동), (강남, 목동),
#   (서초, 반포동), (서초, 잠원동),
#   (송파, 잠실동), (송파, 가락동)
#
# 같은 결과를 평면 keywords로 만들려면 region별로 캠페인을 3개 분리해야
# 한다. 트리 키워드는 캠페인 1개로 처리한다.

platform: naver

accounts:
  - username: naver_id
    password: pw
    blog_id: myblog

# 제목에 부모와 자식을 모두 박을 수 있다. 새 토큰 필요 없음.
titles:
  - "{keyword:region} 국어과외 {keyword:district} 수학과외"

keywords:
  # 부모 — 평면 keyword
  region: [강남, 서초, 송파]

  # 자식 — 트리 keyword. region 값마다 다른 자식 후보를 갖는다.
  district:
    parent: region
    by:
      강남:  [대치동, 목동]
      서초:  [반포동, 잠원동]
      송파:  [잠실동, 가락동]
      # _default: [전지역]      # 부모 값에 entry가 없을 때 폴백

  # 평면 keyword와 자유롭게 조합 가능 (cartesian × tree expansion)
  subject: [수학]

post:
  - h1: "{keyword:region} {keyword:district} {keyword:subject}과외"

  - paragraph: |
      {keyword:region} {keyword:district}에서 {keyword:subject}과외를 찾는
      학부모를 위한 가이드를 자연스럽게 작성해줘. 부모 지역({keyword:region})
      과 세부 지역({keyword:district})을 자연스럽게 본문에 녹여줘.

  - featured_image:
      path: thumb.jpg
      overlay_text: "{keyword:district} {keyword:subject}과외"

assets: ./images

publish:
  schedule: '++ 30m ~ 60m'
  tags: [교육, 과외]
  visibility: public

run:
  interval: 30s
  on_failure: continue
  headless: true

# ─────────────────────────────────────────────────────────
# 외부 파일 변형 (큰 트리 / GUI 엑셀 연동 시):
#
#   keywords:
#     region: [강남, 서초, 송파]
#     district:
#       parent: region
#       file: trees/region_district.yaml
#
#   trees/region_district.yaml:
#     강남: [대치동, 목동]
#     서초: [반포동, 잠원동]
#     송파: [잠실동, 가락동]
#     _default: [전지역]
#
# 다층 트리 (region → district → dong):
#
#   keywords:
#     region:   [강남]
#     district:
#       parent: region
#       by: { 강남: [대치동, 목동] }
#     dong:
#       parent: district
#       by: { 대치동: [은마, 선경], 목동: [1단지, 6단지] }
#
#   결과: (강남, 대치동, 은마), (강남, 대치동, 선경),
#        (강남, 목동, 1단지), (강남, 목동, 6단지)
