# ── 외부 맵 파일 활용 ────────────────────────────────────
# 지역별로 다른 이미지/링크를 매핑하는 경우.
# 맵 파일은 순수 키:값 YAML — 누구나 편집 가능.

platform: naver

browser:
  viewport: [1920, 1080]
  geolocation: [37.497, 127.027]
  fingerprint:
    webdriver: false
    plugins: true

accounts:
  - username: map_blog
    password: pw1
    blog_id: mapblog

titles:
  - "{keyword:region} {keyword:subject} 과외 추천"

keywords:
  region: [강남, 서초, 잠실, 송파, 강동]
  subject: [수학, 영어]

maps:
  photo:
    file: maps/region_photo.yaml
    by: "{keyword:region}"
  thumb:
    file: maps/region_thumb.yaml
    by: "{keyword:region}"
  link:
    file: maps/region_link.yaml
    by: "{keyword:region}"

post:
  - image:
      path: "{map:photo}"
      link: "{map:link}"
      wait: 3s
  - divider
  - h2: "{keyword:region} {keyword:subject} 과외"
  - text: "{keyword:region}에서 가장 신뢰받는 {keyword:subject} 과외를 소개합니다."
  - paragraph: "{keyword:region} {keyword:subject} 과외를 자연스럽게 소개해줘"
  - quote: "{keyword:region} {keyword:subject} 과외 즉시 가능"
  - paragraph: "{keyword:region} {keyword:subject} 과외 후기를 학부모 관점에서 써줘"
  - divider
  - featured_image:
      path: "{map:thumb}"
      link: "{map:link}"
      overlay_text: "{keyword:region} {keyword:subject} 과외"
      overlay_background: 0.5
      overlay_position: bottom
      effects:
        - effect: "hue:0.0 ~ 0.03"
        - effect: "saturation:0.7 ~ 1.3"
        - effect: "brightness:0.95 ~ 1.05"
      wait: 3s

assets: ./images

publish:
  schedule: '++ 15m ~ 30m'
  tags: [교육, 과외]

run:
  interval: 60s
  headless: true
