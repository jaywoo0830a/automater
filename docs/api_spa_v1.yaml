# =============================================================================
# automater-dev — api/spa/v1
# =============================================================================
# 사용자의 4단계 워크플로우:
#
#   Step 1. 계정 엑셀 업로드 & 선택
#   Step 2. 키워드 엑셀 업로드 & 선택
#   Step 3. 미리 정해진 템플릿 선택
#   Step 4. 런타임 옵션(즉시/예약) 설정 → 실행
#
# 보조:
#   - 로그인
#   - 진행 상황 모니터링
# =============================================================================
openapi: 3.2.0

info:
  title: automater SPA API
  version: 1.0.0
  description: |
    4단계 블로그 포스팅 자동화 워크플로우.

    1. 계정 엑셀 업로드 & 선택
    2. 키워드 엑셀 업로드 & 선택
    3. 템플릿 선택
    4. 실행 옵션 설정 & 실행

servers:
  - url: /api/spa/v1

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Login
  - name: step-1-accounts
    description: "Step 1 — Upload account Excel, review, select"
  - name: step-2-keywords
    description: "Step 2 — Upload keyword Excel, review, select"
  - name: step-3-templates
    description: "Step 3 — Choose a pre-defined post template"
  - name: step-4-run
    description: "Step 4 — Set publish options and execute"
  - name: monitor
    description: Watch execution progress

# =============================================================================
# Paths
# =============================================================================
paths:

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      display_name:
                        type: string
                      email:
                        type: string
        "401":
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendlyError"

  # ---------------------------------------------------------------------------
  # Step 1: 계정 엑셀 업로드 & 선택
  # ---------------------------------------------------------------------------
  /step1/accounts/upload:
    post:
      tags: [step-1-accounts]
      operationId: uploadAccountExcel
      summary: Upload account Excel file
      description: |
        Excel columns: username, password, platform, blog_id (optional).
        Parses the file and returns a preview. Nothing is saved yet.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Parsed account preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUploadPreview"
        "422":
          description: File parsing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendlyError"
              example:
                success: false
                message: "Excel file could not be read."
                suggestion: "Check that the file is .xlsx and has columns: username, password, platform."

  /step1/accounts/confirm:
    post:
      tags: [step-1-accounts]
      operationId: confirmAccounts
      summary: Save uploaded accounts and select which to use
      description: |
        Saves the parsed accounts to DB.
        The `selected` array indicates which rows to use for this run.
        Accounts not selected are saved but not activated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountConfirmInput"
      responses:
        "200":
          description: Accounts saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConfirmResult"

  /step1/accounts:
    get:
      tags: [step-1-accounts]
      operationId: listAccounts
      summary: List all saved accounts with status
      description: |
        Returns previously uploaded accounts with availability status.
        The user can re-select accounts without re-uploading.
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountView"

  /step1/accounts/select:
    put:
      tags: [step-1-accounts]
      operationId: selectAccounts
      summary: Change which accounts are selected for this run
      description: |
        Re-select from existing accounts without uploading again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_ids]
              properties:
                account_ids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: Selection updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountConfirmResult"

  # ---------------------------------------------------------------------------
  # Step 2: 키워드 엑셀 업로드 & 선택
  # ---------------------------------------------------------------------------
  /step2/keywords/upload:
    post:
      tags: [step-2-keywords]
      operationId: uploadKeywordExcel
      summary: Upload keyword Excel file
      description: |
        Each column header becomes a keyword category (e.g., region, subject).
        Each row value becomes a keyword.
        Parses and returns a preview. Nothing is saved yet.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Parsed keyword preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordUploadPreview"
        "422":
          description: File parsing failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendlyError"

  /step2/keywords/confirm:
    post:
      tags: [step-2-keywords]
      operationId: confirmKeywords
      summary: Save keywords and select which to use
      description: |
        Saves parsed keywords to DB (categories + keywords + affixes).
        The `selections` map indicates which keywords per category to include.
        Omitted categories or keywords are saved but excluded from combinations.

        Also generates the title template token sequence automatically
        from the category order in the Excel (left to right = token order).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeywordConfirmInput"
      responses:
        "200":
          description: Keywords saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordConfirmResult"

  /step2/keywords:
    get:
      tags: [step-2-keywords]
      operationId: listKeywords
      summary: List saved keywords grouped by category
      description: |
        Returns previously uploaded keywords with selection state.
        The user can re-select without re-uploading.
      parameters:
        - name: campaign_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Keywords grouped by category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeywordCategoryView"

  /step2/keywords/select:
    put:
      tags: [step-2-keywords]
      operationId: selectKeywords
      summary: Change which keywords are selected
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeywordSelectInput"
      responses:
        "200":
          description: Selection updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordConfirmResult"

  /step2/pools/upload:
    post:
      tags: [step-2-keywords]
      operationId: uploadPoolExcel
      summary: Upload title decoration pool Excel (optional)
      description: |
        Each column = a pool slug (e.g., salt_prefix, salt_suffix).
        Each row value = a pool item.
        These are used for title randomization.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Pool import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolUploadResult"

  # ---------------------------------------------------------------------------
  # Step 3: 템플릿 선택
  # ---------------------------------------------------------------------------
  /step3/templates:
    get:
      tags: [step-3-templates]
      operationId: listTemplates
      summary: List available post templates
      description: |
        Returns pre-defined PostLayouts.
        Each template describes a block sequence
        (e.g., "heading + 3 paragraphs + image + 2 paragraphs").
        The user picks one.
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateView"

  /step3/templates/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [step-3-templates]
      operationId: getTemplate
      summary: Get template detail with block list
      responses:
        "200":
          description: Template detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateDetailView"

  /step3/templates/{templateId}/preview:
    parameters:
      - name: templateId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [step-3-templates]
      operationId: previewTemplate
      summary: Preview how a post will look with selected keywords
      description: |
        Combines the selected template with selected keywords
        to generate a sample post preview (title + body outline).
        Nothing is saved — this is a dry run.
      parameters:
        - name: campaign_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Post preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostPreview"

  # ---------------------------------------------------------------------------
  # Step 4: 런타임 옵션 & 실행
  # ---------------------------------------------------------------------------
  /step4/run/preview:
    post:
      tags: [step-4-run]
      operationId: previewRun
      summary: Preview the execution plan before committing
      description: |
        Shows what will happen: how many combinations, how many posts
        per account, estimated schedule. The user reviews before clicking "Go".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunConfig"
      responses:
        "200":
          description: Execution plan preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunPreviewView"

  /step4/run/execute:
    post:
      tags: [step-4-run]
      operationId: executeRun
      summary: Execute the posting run
      description: |
        The final "Go" button.
        Generates combinations, dispatches batches, and starts execution.
        Returns a run ID for monitoring.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunConfig"
      responses:
        "201":
          description: Run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStartResult"
        "422":
          description: Configuration invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendlyError"

  # ---------------------------------------------------------------------------
  # Monitor
  # ---------------------------------------------------------------------------
  /monitor/runs:
    get:
      tags: [monitor]
      operationId: listRuns
      summary: List all runs with progress
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunProgressView"

  /monitor/runs/{batchId}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [monitor]
      operationId: getRunDetail
      summary: Get detailed progress for a run
      responses:
        "200":
          description: Run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetailView"

  /monitor/runs/{batchId}/retry:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [monitor]
      operationId: retryFailed
      summary: Retry failed items in a run
      responses:
        "200":
          description: Retry result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /monitor/runs/{batchId}/stop:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: integer
    post:
      tags: [monitor]
      operationId: stopRun
      summary: Stop a running batch
      responses:
        "200":
          description: Stop result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

# =============================================================================
# Components
# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # -- Common ---------------------------------------------------------------
    FriendlyError:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        suggestion:
          type: string

    # -- Step 1: Accounts -----------------------------------------------------
    AccountUploadPreview:
      type: object
      properties:
        success:
          type: boolean
        rows:
          type: array
          items:
            type: object
            properties:
              row_number:
                type: integer
              username:
                type: string
              platform:
                type: string
              blog_id:
                type: string
              valid:
                type: boolean
              error:
                type: string
                nullable: true
                description: "e.g., 'Missing password'"
        valid_count:
          type: integer
        invalid_count:
          type: integer

    AccountConfirmInput:
      type: object
      required: [accounts, selected]
      properties:
        accounts:
          type: array
          description: All parsed rows to save
          items:
            type: object
            required: [username, password, platform]
            properties:
              username:
                type: string
              password:
                type: string
              platform:
                type: string
                description: "Platform slug, e.g., 'naver'"
              blog_id:
                type: string
              cooldown_days:
                type: integer
                default: 14
        selected:
          type: array
          description: Indices (0-based) of rows to activate for this run
          items:
            type: integer

    AccountConfirmResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          description: "e.g., '3 accounts saved. 2 selected for posting.'"
        saved_count:
          type: integer
        selected_count:
          type: integer

    AccountView:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        platform:
          type: string
        status:
          type: string
          description: "e.g., 'Ready', 'Cooling (3 days left)', 'Disabled'"
        selected:
          type: boolean
        last_used:
          type: string
          nullable: true
          description: "e.g., '15 days ago'"

    # -- Step 2: Keywords -----------------------------------------------------
    KeywordUploadPreview:
      type: object
      properties:
        success:
          type: boolean
        categories:
          type: array
          items:
            type: object
            properties:
              column_name:
                type: string
                description: Excel column header
              slug:
                type: string
                description: Auto-generated slug
              keyword_count:
                type: integer
              sample_values:
                type: array
                items:
                  type: string
              detected_affixes:
                type: array
                items:
                  type: string
                  description: "e.g., 'suffix: 동, 구'"
        total_keywords:
          type: integer
        estimated_combinations:
          type: integer
          description: Cartesian product of all categories

    KeywordConfirmInput:
      type: object
      required: [campaign_name, platform_id, categories]
      properties:
        campaign_name:
          type: string
        platform_id:
          type: integer
        categories:
          type: array
          description: |
            One entry per Excel column. Order = title template token order.
          items:
            type: object
            required: [slug, values]
            properties:
              slug:
                type: string
              values:
                type: array
                description: Selected keyword values from this category
                items:
                  type: string

    KeywordConfirmResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          description: "e.g., '2 categories, 45 keywords saved. Title: {region} {subject}'"
        campaign_id:
          type: integer
        title_template:
          type: string
          description: "Auto-generated, e.g., '{region} {subject}'"
        combination_count:
          type: integer
          description: How many posts will be generated

    KeywordCategoryView:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        keywords:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              value:
                type: string
              selected:
                type: boolean

    KeywordSelectInput:
      type: object
      required: [campaign_id, categories]
      properties:
        campaign_id:
          type: integer
        categories:
          type: array
          items:
            type: object
            required: [slug, keyword_ids]
            properties:
              slug:
                type: string
              keyword_ids:
                type: array
                items:
                  type: integer

    PoolUploadResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        pools:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              count:
                type: integer
              samples:
                type: array
                items:
                  type: string

    # -- Step 3: Templates ----------------------------------------------------
    TemplateView:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          description: "e.g., 'Heading + 3 paragraphs + featured image'"
        block_summary:
          type: string
          description: "e.g., 'H2 → P → P → IMG → P → P → FEATURED'"

    TemplateDetailView:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        blocks:
          type: array
          items:
            type: object
            properties:
              order:
                type: integer
              type:
                type: string
                enum: [heading, paragraph, image, featured, list, quote, divider]
              label:
                type: string
                description: "e.g., 'SEO intro paragraph', 'Body image'"
              config_summary:
                type: string
                nullable: true
                description: "e.g., 'min 200 chars, informational tone'"

    PostPreview:
      type: object
      properties:
        sample_title:
          type: string
          description: "e.g., '강남 수학 과외 전문 추천'"
        blocks:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              placeholder:
                type: string
                description: "e.g., '[AI paragraph about 강남 수학 과외]'"

    # -- Step 4: Run ----------------------------------------------------------
    RunConfig:
      type: object
      required: [campaign_id, template_id, publish_mode]
      properties:
        campaign_id:
          type: integer
        template_id:
          type: integer
        publish_mode:
          type: string
          enum: [immediate, scheduled]
        schedule_start:
          type: string
          format: date-time
          description: Required when publish_mode is 'scheduled'
        schedule_interval_minutes:
          type: integer
          default: 60
          description: Minutes between posts for scheduled mode
        headless:
          type: boolean
          default: true

    RunPreviewView:
      type: object
      properties:
        campaign_name:
          type: string
        template_name:
          type: string
        total_combinations:
          type: integer
        accounts:
          type: array
          items:
            type: object
            properties:
              username:
                type: string
              posts_assigned:
                type: integer
        publish_mode:
          type: string
        schedule_summary:
          type: string
          nullable: true
          description: "e.g., 'Starting 3/23 2:00 PM, one post every 60 min'"
        estimated_finish:
          type: string
          nullable: true
          description: "e.g., '3/23 5:00 PM'"
        sample_titles:
          type: array
          description: First 5 generated titles
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    RunStartResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          description: "e.g., '180 posts scheduled across 3 accounts.'"
        batch_ids:
          type: array
          items:
            type: integer
        total_posts:
          type: integer

    # -- Monitor --------------------------------------------------------------
    RunProgressView:
      type: object
      properties:
        batch_id:
          type: integer
        campaign_name:
          type: string
        account:
          type: string
        status:
          type: string
          description: "e.g., 'Running', 'Completed', '3 failed'"
        completed:
          type: integer
        failed:
          type: integer
        total:
          type: integer
        percentage:
          type: integer
        started_at:
          type: string
          nullable: true
          description: "e.g., '3/23 2:00 PM'"
        last_activity:
          type: string
          description: "e.g., '2 minutes ago'"

    RunDetailView:
      type: object
      properties:
        batch_id:
          type: integer
        campaign_name:
          type: string
        account:
          type: string
        status:
          type: string
        completed:
          type: integer
        failed:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              keywords:
                type: string
                description: "e.g., '강남 수학'"
              status:
                type: string
                description: "e.g., 'Published', 'Failed', 'Waiting'"
              url:
                type: string
                nullable: true
              error:
                type: string
                nullable: true
              completed_at:
                type: string
                nullable: true
