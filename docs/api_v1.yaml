# =============================================================================
# automater — api/v1 v2.1 (comprehensive)
# =============================================================================
# Representations → DB tables:
#   Billboard        → (entry point)
#   Profile          → users
#   AccountSetup     → accounts, platforms
#   TitleWorkbench   → keyword_categories, keywords, affixes, keyword_affixes,
#                      campaign_palettes, palette_items, campaign_affix_overrides
#   Campaign         → campaigns, template_tokens, campaign_slots,
#                      spacing_rules, campaign_keyword_picks
#   TemplateWorkshop → post_layouts, layout_slots
#   Presets          → publish_presets, run_presets
#   MediaLibrary     → media
#   ExecutionPlan    → combinations (auto-generated)
#   RunDetail        → batches, batch_items
# =============================================================================
openapi: 3.1.0
info:
  title: automater API
  version: 2.1.0
  description: |
    Blog posting automation — representation-based API.
    Every response includes `_links`. Start at `GET /api/v1`.

servers:
  - url: /api/v1
security:
  - bearerAuth: []

tags:
  - name: billboard
  - name: auth
  - name: profile
    description: "User profile and settings"
  - name: accounts
    description: "Account setup and management"
  - name: title-workbench
    description: "Title pipeline — keywords, decorations, spacing, blocks"
  - name: campaigns
  - name: templates
    description: "Post template workshop"
  - name: presets
    description: "Publish and run presets"
  - name: media
    description: "Image and file library"
  - name: runs
    description: "Execution and monitoring"

paths:

  # =========================================================================
  # Billboard
  # =========================================================================
  /:
    get:
      tags: [billboard]
      operationId: getBillboard
      summary: API entry point
      security: []
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Billboard" }

  # =========================================================================
  # Auth
  # =========================================================================
  /auth/token:
    post:
      tags: [auth]
      operationId: createToken
      summary: Login — get access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Problem" }

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create new account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email: { type: string }
                password: { type: string }
                display_name: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }

  # =========================================================================
  # Profile (users table)
  # =========================================================================
  /profile:
    get:
      tags: [profile]
      operationId: getProfile
      summary: Current user profile
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    put:
      tags: [profile]
      operationId: updateProfile
      summary: Update profile (name, password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string }
                current_password: { type: string }
                new_password: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }

  # =========================================================================
  # Accounts (accounts + platforms tables)
  # =========================================================================
  /platforms:
    get:
      tags: [accounts]
      operationId: listPlatforms
      summary: Available platforms (read-only)
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformList" }

  /accounts:
    get:
      tags: [accounts]
      operationId: getAccountSetup
      summary: All accounts with readiness
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSetup" }
    post:
      tags: [accounts]
      operationId: saveAccounts
      summary: Save parsed accounts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveAccountsRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSetup" }

  /accounts/upload:
    post:
      tags: [accounts]
      operationId: uploadAccountExcel
      summary: Parse Excel — preview only
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountPreview" }

  /accounts/selection:
    put:
      tags: [accounts]
      operationId: updateSelection
      summary: Change selection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selected_slugs]
              properties:
                selected_slugs:
                  type: array
                  items: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSetup" }

  /accounts/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    put:
      tags: [accounts]
      operationId: updateAccount
      summary: Edit account (password, cooldown, blog_id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string }
                blog_id: { type: string }
                cooldown_days: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSetup" }
    delete:
      tags: [accounts]
      operationId: deleteAccount
      summary: Remove account
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountSetup" }

  # =========================================================================
  # Title Workbench
  # =========================================================================
  /title-workbench:
    get:
      tags: [title-workbench]
      operationId: getTitleWorkbench
      summary: Complete title config in one call
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleWorkbench" }

  # -- Keywords -------
  /title-workbench/keywords/upload:
    post:
      tags: [title-workbench]
      operationId: uploadKeywordExcel
      summary: Parse keyword Excel — preview
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeywordUploadPreview" }

  /title-workbench/keywords:
    post:
      tags: [title-workbench]
      operationId: importKeywords
      summary: Save keywords with auto-affix detection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportKeywordsRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleWorkbench" }

  /title-workbench/keywords/{group}:
    parameters:
      - { name: group, in: path, required: true, schema: { type: string }, description: "Group slug" }
    put:
      tags: [title-workbench]
      operationId: editKeywordGroup
      summary: Rename a keyword group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleWorkbench" }
    delete:
      tags: [title-workbench]
      operationId: deleteKeywordGroup
      summary: Delete entire keyword group
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleWorkbench" }

  /title-workbench/keywords/{group}/{value}:
    parameters:
      - { name: group, in: path, required: true, schema: { type: string } }
      - { name: value, in: path, required: true, schema: { type: string } }
    put:
      tags: [title-workbench]
      operationId: upsertKeyword
      summary: Add or edit a keyword (display_value, active)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_value: { type: string }
                active: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleWorkbench" }
    delete:
      tags: [title-workbench]
      operationId: removeKeyword
      summary: Remove a keyword
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleWorkbench" }

  # -- Affixes -------
  /title-workbench/affixes:
    put:
      tags: [title-workbench]
      operationId: toggleAffixes
      summary: Toggle affix stripping per keyword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AffixToggleRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleWorkbench" }

  # -- Decorations -------
  /title-workbench/decorations/upload:
    post:
      tags: [title-workbench]
      operationId: uploadDecorationExcel
      summary: Upload decoration Excel — saved immediately
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleWorkbench" }

  /title-workbench/decorations/{pool}:
    parameters:
      - { name: pool, in: path, required: true, schema: { type: string }, description: "Pool slug" }
    delete:
      tags: [title-workbench]
      operationId: deleteDecorationPool
      summary: Delete entire decoration pool
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleWorkbench" }

  /title-workbench/decorations/{pool}/{value}:
    parameters:
      - { name: pool, in: path, required: true, schema: { type: string } }
      - { name: value, in: path, required: true, schema: { type: string } }
    put:
      tags: [title-workbench]
      operationId: upsertDecoration
      summary: Add or edit a decoration item (active toggle)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                active: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleWorkbench" }
    delete:
      tags: [title-workbench]
      operationId: removeDecoration
      summary: Remove a decoration item
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitleWorkbench" }

  # -- Preview -------
  /title-workbench/preview:
    post:
      tags: [title-workbench]
      operationId: previewTitles
      summary: Generate sample titles from full config
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TitlePreviewRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TitlePreview" }

  # =========================================================================
  # Campaigns
  # =========================================================================
  /campaigns:
    get:
      tags: [campaigns]
      operationId: listCampaigns
      summary: All campaigns
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignList" }
    post:
      tags: [campaigns]
      operationId: createCampaign
      summary: Create campaign — freeze title config
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCampaignRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }

  /campaigns/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [campaigns]
      operationId: getCampaign
      summary: Campaign detail
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
    put:
      tags: [campaigns]
      operationId: updateCampaign
      summary: Update campaign (name, status)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                status: { type: string, enum: [active, paused, archived] }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
    delete:
      tags: [campaigns]
      operationId: deleteCampaign
      summary: Delete campaign
      responses:
        "204":
          description: Deleted

  # =========================================================================
  # Templates (post_layouts + layout_slots)
  # =========================================================================
  /templates:
    get:
      tags: [templates]
      operationId: getTemplateGallery
      summary: Template gallery
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateGallery" }
    post:
      tags: [templates]
      operationId: createTemplate
      summary: Create a new post template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTemplateRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDetail" }

  /templates/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [templates]
      operationId: getTemplate
      summary: Template detail with blocks
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDetail" }
    put:
      tags: [templates]
      operationId: updateTemplate
      summary: Update template (name, description, blocks)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTemplateRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplateDetail" }
    delete:
      tags: [templates]
      operationId: deleteTemplate
      summary: Delete template
      responses:
        "204":
          description: Deleted

  /templates/{slug}/preview:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [templates]
      operationId: previewPost
      summary: Sample post preview with campaign data
      parameters:
        - { name: campaign, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostPreview" }

  # =========================================================================
  # Presets (publish_presets + run_presets)
  # =========================================================================
  /presets:
    get:
      tags: [presets]
      operationId: getPresets
      summary: All saved presets (publish + run)
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresetLibrary" }

  /presets/publish:
    post:
      tags: [presets]
      operationId: createPublishPreset
      summary: Save a publish preset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavePresetRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresetLibrary" }

  /presets/publish/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    put:
      tags: [presets]
      operationId: updatePublishPreset
      summary: Update publish preset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavePresetRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresetLibrary" }
    delete:
      tags: [presets]
      operationId: deletePublishPreset
      summary: Delete publish preset
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresetLibrary" }

  /presets/run:
    post:
      tags: [presets]
      operationId: createRunPreset
      summary: Save a run preset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavePresetRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresetLibrary" }

  /presets/run/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    put:
      tags: [presets]
      operationId: updateRunPreset
      summary: Update run preset
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavePresetRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresetLibrary" }
    delete:
      tags: [presets]
      operationId: deleteRunPreset
      summary: Delete run preset
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresetLibrary" }

  # =========================================================================
  # Media Library
  # =========================================================================
  /media:
    get:
      tags: [media]
      operationId: getMediaLibrary
      summary: All uploaded images and files
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaLibrary" }

  /media/upload:
    post:
      tags: [media]
      operationId: uploadMedia
      summary: Upload an image or file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaLibrary" }

  /media/{ref}:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    delete:
      tags: [media]
      operationId: deleteMedia
      summary: Delete a media file
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaLibrary" }

  # =========================================================================
  # Runs
  # =========================================================================
  /campaigns/{slug}/runs:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [runs]
      operationId: previewExecution
      summary: Preview execution plan
      parameters:
        - { name: template, in: query, required: true, schema: { type: string } }
        - { name: mode, in: query, schema: { type: string, enum: [immediate, scheduled] } }
        - { name: publish_preset, in: query, schema: { type: string } }
        - { name: run_preset, in: query, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionPlan" }
    post:
      tags: [runs]
      operationId: startExecution
      summary: Start posting
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartExecutionRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunProgress" }

  /runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: All runs
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunList" }

  /runs/{ref}:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    get:
      tags: [runs]
      operationId: getRunDetail
      summary: Run detail — progress + postings
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }

  /runs/{ref}/retry:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    post:
      tags: [runs]
      operationId: retryFailed
      summary: Retry failed postings
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }

  /runs/{ref}/stop:
    parameters:
      - { name: ref, in: path, required: true, schema: { type: string } }
    post:
      tags: [runs]
      operationId: stopRun
      summary: Stop execution
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }

# =============================================================================
# Components
# =============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Link:
      type: object
      properties:
        href: { type: string }
        method: { type: string }
        title: { type: string }

    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        detail: { type: string }
        suggestion: { type: string }

    # -- Billboard --
    Billboard:
      type: object
      properties:
        _type: { type: string, const: Billboard }
        _links:
          type: object
          properties:
            self: { $ref: "#/components/schemas/Link" }
            auth: { $ref: "#/components/schemas/Link" }
            register: { $ref: "#/components/schemas/Link" }
            profile: { $ref: "#/components/schemas/Link" }
            platforms: { $ref: "#/components/schemas/Link" }
            accounts: { $ref: "#/components/schemas/Link" }
            title-workbench: { $ref: "#/components/schemas/Link" }
            campaigns: { $ref: "#/components/schemas/Link" }
            templates: { $ref: "#/components/schemas/Link" }
            presets: { $ref: "#/components/schemas/Link" }
            media: { $ref: "#/components/schemas/Link" }
            runs: { $ref: "#/components/schemas/Link" }

    # -- Auth + Profile --
    TokenResponse:
      type: object
      properties:
        _type: { type: string, const: Token }
        _links:
          type: object
          properties:
            profile: { $ref: "#/components/schemas/Link" }
            accounts: { $ref: "#/components/schemas/Link" }
        token: { type: string }
        display_name: { type: string }

    Profile:
      type: object
      properties:
        _type: { type: string, const: Profile }
        _links:
          type: object
          properties:
            self: { $ref: "#/components/schemas/Link" }
            update: { $ref: "#/components/schemas/Link" }
        email: { type: string }
        display_name: { type: string }
        role: { type: string }
        created_at: { type: string }

    # -- Platforms --
    PlatformList:
      type: object
      properties:
        _type: { type: string, const: PlatformList }
        _links:
          type: object
          properties:
            self: { $ref: "#/components/schemas/Link" }
        items:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              name: { type: string }
              base_url: { type: string }

    # -- Accounts --
    AccountEntry:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        platform: { type: string }
        readiness: { type: string, enum: [ready, cooling, disabled] }
        cooling_days_left: { type: integer, nullable: true }
        selected: { type: boolean }
        last_used: { type: string, nullable: true }
        _links:
          type: object
          properties:
            edit: { $ref: "#/components/schemas/Link" }
            remove: { $ref: "#/components/schemas/Link" }

    AccountSetup:
      type: object
      properties:
        _type: { type: string, const: AccountSetup }
        _links:
          type: object
          properties:
            self: { $ref: "#/components/schemas/Link" }
            upload: { $ref: "#/components/schemas/Link" }
            save: { $ref: "#/components/schemas/Link" }
            update_selection: { $ref: "#/components/schemas/Link" }
            title-workbench: { $ref: "#/components/schemas/Link" }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AccountEntry" }
        ready_count: { type: integer }
        selected_count: { type: integer }

    AccountPreview:
      type: object
      properties:
        _type: { type: string, const: AccountPreview }
        _links:
          type: object
          properties:
            confirm: { $ref: "#/components/schemas/Link" }
        rows:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              platform: { type: string }
              blog_url: { type: string }
              valid: { type: boolean }
              problem: { type: string, nullable: true }
        valid_count: { type: integer }

    SaveAccountsRequest:
      type: object
      required: [accounts, selected_slugs]
      properties:
        accounts:
          type: array
          items:
            type: object
            required: [name, password, platform]
            properties:
              name: { type: string }
              password: { type: string }
              platform: { type: string }
              blog_id: { type: string }
              cooldown_days: { type: integer, default: 14 }
        selected_slugs:
          type: array
          items: { type: string }

    # -- TitleWorkbench --
    KeywordEntry:
      type: object
      properties:
        value: { type: string }
        display_value: { type: string }
        active: { type: boolean }
        affixes:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [prefix, suffix] }
              chars: { type: string }
              keep: { type: boolean }
              stripped: { type: string }

    KeywordGroup:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        keywords:
          type: array
          items: { $ref: "#/components/schemas/KeywordEntry" }
        _links:
          type: object
          properties:
            edit: { $ref: "#/components/schemas/Link" }
            remove: { $ref: "#/components/schemas/Link" }
            add_keyword: { $ref: "#/components/schemas/Link" }

    DecorationPool:
      type: object
      properties:
        slug: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              active: { type: boolean }
        _links:
          type: object
          properties:
            remove: { $ref: "#/components/schemas/Link" }
            add_item: { $ref: "#/components/schemas/Link" }

    SpacingStyle:
      type: object
      properties:
        name: { type: string }
        pattern:
          type: object
          additionalProperties: { type: integer, enum: [0, 1] }

    TitleBlock:
      type: object
      properties:
        kind: { type: string, enum: [keyword, decoration, text] }
        slug: { type: string }
        text: { type: string }
        position: { type: integer }

    TitleWorkbench:
      type: object
      properties:
        _type: { type: string, const: TitleWorkbench }
        _links:
          type: object
          properties:
            self: { $ref: "#/components/schemas/Link" }
            upload_keywords: { $ref: "#/components/schemas/Link" }
            import_keywords: { $ref: "#/components/schemas/Link" }
            toggle_affixes: { $ref: "#/components/schemas/Link" }
            upload_decorations: { $ref: "#/components/schemas/Link" }
            preview: { $ref: "#/components/schemas/Link" }
            create_campaign: { $ref: "#/components/schemas/Link" }
        keyword_groups:
          type: array
          items: { $ref: "#/components/schemas/KeywordGroup" }
        decoration_pools:
          type: array
          items: { $ref: "#/components/schemas/DecorationPool" }
        spacing_styles:
          type: array
          items: { $ref: "#/components/schemas/SpacingStyle" }
        title_blocks:
          type: array
          items: { $ref: "#/components/schemas/TitleBlock" }

    KeywordUploadPreview:
      type: object
      properties:
        _type: { type: string, const: KeywordUploadPreview }
        _links:
          type: object
          properties:
            import: { $ref: "#/components/schemas/Link" }
        groups:
          type: array
          items:
            type: object
            properties:
              column_name: { type: string }
              slug: { type: string }
              count: { type: integer }
              samples:
                type: array
                items: { type: string }
              detected_affixes:
                type: array
                items: { type: string }
        total_keywords: { type: integer }

    ImportKeywordsRequest:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [slug, values]
            properties:
              slug: { type: string }
              name: { type: string }
              values:
                type: array
                items: { type: string }
        auto_detect_affixes: { type: boolean, default: true }

    AffixToggleRequest:
      type: object
      required: [toggles]
      properties:
        toggles:
          type: array
          items:
            type: object
            required: [group, keyword, affix_chars, keep]
            properties:
              group: { type: string }
              keyword: { type: string }
              affix_chars: { type: string }
              keep: { type: boolean }

    TitlePreviewRequest:
      type: object
      required: [title_blocks]
      properties:
        title_blocks:
          type: array
          items: { $ref: "#/components/schemas/TitleBlock" }
        selected_keywords:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        spacing_styles:
          type: array
          items: { $ref: "#/components/schemas/SpacingStyle" }
        affix_toggles:
          type: array
          items:
            type: object
            properties:
              keyword: { type: string }
              affix_chars: { type: string }
              keep: { type: boolean }
        sample_count: { type: integer, default: 3 }

    TitlePreview:
      type: object
      properties:
        _type: { type: string, const: TitlePreview }
        _links:
          type: object
          properties:
            create_campaign: { $ref: "#/components/schemas/Link" }
        styles:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              template: { type: string }
              samples:
                type: array
                items: { type: string }
        combination_count: { type: integer }
        warnings:
          type: array
          items: { type: string }

    # -- Campaigns --
    CreateCampaignRequest:
      type: object
      required: [name, platform, selected_keywords, title_blocks, spacing_styles]
      properties:
        name: { type: string }
        platform: { type: string }
        selected_keywords:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        title_blocks:
          type: array
          items: { $ref: "#/components/schemas/TitleBlock" }
        spacing_styles:
          type: array
          items: { $ref: "#/components/schemas/SpacingStyle" }
        affix_toggles:
          type: array
          items:
            type: object
            properties:
              keyword: { type: string }
              affix_chars: { type: string }
              keep: { type: boolean }

    Campaign:
      type: object
      properties:
        _type: { type: string, const: Campaign }
        _links:
          type: object
          properties:
            self: { $ref: "#/components/schemas/Link" }
            collection: { $ref: "#/components/schemas/Link" }
            edit: { $ref: "#/components/schemas/Link" }
            remove: { $ref: "#/components/schemas/Link" }
            templates: { $ref: "#/components/schemas/Link" }
            preview_execution: { $ref: "#/components/schemas/Link" }
            start_execution: { $ref: "#/components/schemas/Link" }
        slug: { type: string }
        name: { type: string }
        platform: { type: string }
        status: { type: string, enum: [active, paused, archived] }
        title_template: { type: string }
        spacing_style_count: { type: integer }
        combination_count: { type: integer }
        created_at: { type: string }

    CampaignList:
      type: object
      properties:
        _type: { type: string, const: CampaignList }
        _links:
          type: object
          properties:
            self: { $ref: "#/components/schemas/Link" }
            create: { $ref: "#/components/schemas/Link" }
        items:
          type: array
          items: { $ref: "#/components/schemas/Campaign" }

    # -- Templates --
    TemplateBlock:
      type: object
      properties:
        position: { type: integer }
        kind: { type: string, enum: [heading, paragraph, image, featured, list, quote, divider] }
        label: { type: string }
        config:
          type: object
          additionalProperties: true

    CreateTemplateRequest:
      type: object
      required: [name, blocks]
      properties:
        name: { type: string }
        description: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/TemplateBlock" }

    UpdateTemplateRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/TemplateBlock" }

    TemplateGallery:
      type: object
      properties:
        _type: { type: string, const: TemplateGallery }
        _links:
          type: object
          properties:
            self: { $ref: "#/components/schemas/Link" }
            create: { $ref: "#/components/schemas/Link" }
        items:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              name: { type: string }
              description: { type: string }
              block_summary: { type: string }
              _links:
                type: object
                properties:
                  self: { $ref: "#/components/schemas/Link" }
                  edit: { $ref: "#/components/schemas/Link" }
                  remove: { $ref: "#/components/schemas/Link" }
                  preview: { $ref: "#/components/schemas/Link" }

    TemplateDetail:
      type: object
      properties:
        _type: { type: string, const: TemplateDetail }
        _links:
          type: object
          properties:
            self: { $ref: "#/components/schemas/Link" }
            collection: { $ref: "#/components/schemas/Link" }
            edit: { $ref: "#/components/schemas/Link" }
            remove: { $ref: "#/components/schemas/Link" }
            preview: { $ref: "#/components/schemas/Link" }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/TemplateBlock" }

    PostPreview:
      type: object
      properties:
        _type: { type: string, const: PostPreview }
        _links:
          type: object
          properties:
            template: { $ref: "#/components/schemas/Link" }
            campaign: { $ref: "#/components/schemas/Link" }
        sample_title: { type: string }
        blocks:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              placeholder: { type: string }

    # -- Presets --
    PresetEntry:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        config:
          type: object
          additionalProperties: true
        _links:
          type: object
          properties:
            edit: { $ref: "#/components/schemas/Link" }
            remove: { $ref: "#/components/schemas/Link" }

    PresetLibrary:
      type: object
      properties:
        _type: { type: string, const: PresetLibrary }
        _links:
          type: object
          properties:
            self: { $ref: "#/components/schemas/Link" }
            create_publish: { $ref: "#/components/schemas/Link" }
            create_run: { $ref: "#/components/schemas/Link" }
        publish_presets:
          type: array
          items: { $ref: "#/components/schemas/PresetEntry" }
        run_presets:
          type: array
          items: { $ref: "#/components/schemas/PresetEntry" }

    SavePresetRequest:
      type: object
      required: [name, config]
      properties:
        name: { type: string }
        description: { type: string }
        config:
          type: object
          additionalProperties: true

    # -- Media --
    MediaEntry:
      type: object
      properties:
        ref: { type: string }
        original_name: { type: string }
        content_type: { type: string }
        size_display: { type: string }
        url: { type: string }
        uploaded_at: { type: string }
        _links:
          type: object
          properties:
            remove: { $ref: "#/components/schemas/Link" }

    MediaLibrary:
      type: object
      properties:
        _type: { type: string, const: MediaLibrary }
        _links:
          type: object
          properties:
            self: { $ref: "#/components/schemas/Link" }
            upload: { $ref: "#/components/schemas/Link" }
        items:
          type: array
          items: { $ref: "#/components/schemas/MediaEntry" }
        total_size_display: { type: string }

    # -- Runs --
    StartExecutionRequest:
      type: object
      required: [template, mode]
      properties:
        template: { type: string }
        mode: { type: string, enum: [immediate, scheduled] }
        schedule_start: { type: string, format: date-time }
        interval_minutes: { type: integer, default: 60 }
        headless: { type: boolean, default: true }
        publish_preset: { type: string }
        run_preset: { type: string }

    ExecutionPlan:
      type: object
      properties:
        _type: { type: string, const: ExecutionPlan }
        _links:
          type: object
          properties:
            start: { $ref: "#/components/schemas/Link" }
            campaign: { $ref: "#/components/schemas/Link" }
        campaign_name: { type: string }
        template_name: { type: string }
        total_posts: { type: integer }
        account_assignments:
          type: array
          items:
            type: object
            properties:
              account: { type: string }
              posts: { type: integer }
        schedule_summary: { type: string, nullable: true }
        estimated_finish: { type: string, nullable: true }
        sample_titles:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }

    RunProgress:
      type: object
      properties:
        _type: { type: string, const: RunProgress }
        _links:
          type: object
          properties:
            self: { $ref: "#/components/schemas/Link" }
            retry: { $ref: "#/components/schemas/Link" }
            stop: { $ref: "#/components/schemas/Link" }
        ref: { type: string }
        campaign: { type: string }
        account: { type: string }
        status: { type: string }
        completed: { type: integer }
        failed: { type: integer }
        total: { type: integer }
        percentage: { type: integer }
        last_activity: { type: string }

    RunList:
      type: object
      properties:
        _type: { type: string, const: RunList }
        _links:
          type: object
          properties:
            self: { $ref: "#/components/schemas/Link" }
        items:
          type: array
          items: { $ref: "#/components/schemas/RunProgress" }

    RunDetail:
      type: object
      properties:
        _type: { type: string, const: RunDetail }
        _links:
          type: object
          properties:
            self: { $ref: "#/components/schemas/Link" }
            collection: { $ref: "#/components/schemas/Link" }
            retry: { $ref: "#/components/schemas/Link" }
            stop: { $ref: "#/components/schemas/Link" }
            campaign: { $ref: "#/components/schemas/Link" }
        ref: { type: string }
        campaign: { type: string }
        account: { type: string }
        status: { type: string }
        completed: { type: integer }
        failed: { type: integer }
        total: { type: integer }
        postings:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              status: { type: string }
              blog_url: { type: string, nullable: true }
              error: { type: string, nullable: true }
              completed_at: { type: string, nullable: true }
