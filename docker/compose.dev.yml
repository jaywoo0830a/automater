services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    network_mode: host
    env_file:
      - ../.env
    volumes:
      - ../workspaces:/app/workspaces
      - ../config:/app/config

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    network_mode: host
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
    depends_on:
      - api
