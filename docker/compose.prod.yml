services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      - API_KEY=${API_KEY:?API_KEY is required}
      - ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - workspaces:/app/workspaces

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  workspaces:
