openapi: 3.2.0
info:
  title: Automater Factory API
  version: 0.1.0
  description: |
    SPA backend for blog automation campaign management.
    Designed from current ERD + codebase.
  license:
    name: Proprietary

servers:
  - url: /api/v1

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Registration, login, profile
  - name: admin
    description: User management (admin only)
  - name: platforms
    description: Blog platforms (read-only reference)
  - name: accounts
    description: Blog login accounts
  - name: keywords
    description: Categories, keywords, affixes
  - name: layouts
    description: Reusable post block layouts
  - name: presets
    description: Publish and run presets (JSON config)
  - name: campaigns
    description: Campaign setup, slots, palettes, picks, spacing rules
  - name: combinations
    description: Keyword Cartesian product generation
  - name: batches
    description: Dispatch, execution, monitoring
  - name: utility
    description: Validation and metadata endpoints

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    pageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    perPageParam:
      name: per_page
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object

    Paginated:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          type: string
          enum: [admin, operator]
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: ["string", "null"]
          format: date-time

    Platform:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        base_url:
          type: string
          format: uri
        status:
          type: string

    Account:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        platform_id:
          type: integer
        username:
          type: string
        meta:
          type: object
        cooldown_days:
          type: integer
        last_used_at:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
        note:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time

    KeywordCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string

    Keyword:
      type: object
      properties:
        id:
          type: integer
        category_id:
          type: integer
        parent_id:
          type: ["integer", "null"]
        value:
          type: string
        display_value:
          type: string
        tier:
          type: integer
        active:
          type: boolean
        sort_order:
          type: integer
        metadata:
          type: ["object", "null"]
        children:
          type: array
          items:
            $ref: "#/components/schemas/Keyword"
        affixes:
          type: array
          items:
            $ref: "#/components/schemas/Affix"

    Affix:
      type: object
      properties:
        id:
          type: integer
        keyword_id:
          type: integer
        type:
          type: string
          enum: [prefix, suffix]
        value:
          type: string
        sort_order:
          type: integer
        active:
          type: boolean

    PostLayout:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        slots:
          type: array
          items:
            $ref: "#/components/schemas/LayoutSlot"
        created_at:
          type: string
          format: date-time

    LayoutSlot:
      type: object
      properties:
        id:
          type: integer
        layout_id:
          type: integer
        sort_order:
          type: integer
        block_type:
          type: string
          enum: [heading, paragraph, image, featured, list, quote, divider]
        config:
          type: ["object", "null"]
          description: Block fields with {placeholder} support

    PublishPreset:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        config:
          type: object
          description: Entire PublishOption content as JSON
        created_at:
          type: string
          format: date-time

    RunPreset:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        config:
          type: object
          description: Entire RunSetting content as JSON
        created_at:
          type: string
          format: date-time

    Campaign:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        platform_id:
          type: integer
        layout_id:
          type: ["integer", "null"]
        publish_preset_id:
          type: ["integer", "null"]
        run_preset_id:
          type: ["integer", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        title_template:
          type: string
        config:
          type: ["object", "null"]
        status:
          type: string
          enum: [active, paused, archived]
        created_at:
          type: string
          format: date-time
        layout:
          $ref: "#/components/schemas/PostLayout"
        publish_preset:
          $ref: "#/components/schemas/PublishPreset"
        run_preset:
          $ref: "#/components/schemas/RunPreset"

    CampaignSlot:
      type: object
      properties:
        campaign_id:
          type: integer
        category_id:
          type: integer
        sort_order:
          type: integer
        category:
          $ref: "#/components/schemas/KeywordCategory"

    CampaignPalette:
      type: object
      properties:
        id:
          type: integer
        campaign_id:
          type: integer
        slug:
          type: string
        strategy:
          type: string
          enum: [random, sequential]
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaletteItem"

    PaletteItem:
      type: object
      properties:
        id:
          type: integer
        palette_id:
          type: integer
        value:
          type: string
        sort_order:
          type: integer
        active:
          type: boolean

    SpacingRule:
      type: object
      properties:
        id:
          type: integer
        campaign_id:
          type: integer
        pattern:
          type: object
        description:
          type: string
        active:
          type: boolean

    Combination:
      type: object
      properties:
        id:
          type: integer
        campaign_id:
          type: integer
        spacing_rule_id:
          type: ["integer", "null"]
        keywords:
          type: array
          items:
            $ref: "#/components/schemas/Keyword"
        used_at:
          type: ["string", "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    Batch:
      type: object
      properties:
        id:
          type: integer
        campaign_id:
          type: integer
        account_id:
          type: integer
        scheduled_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        worker_pid:
          type: ["integer", "null"]
        created_at:
          type: string
          format: date-time
        started_at:
          type: ["string", "null"]
          format: date-time
        completed_at:
          type: ["string", "null"]
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/BatchItem"

    BatchItem:
      type: object
      properties:
        id:
          type: integer
        batch_id:
          type: integer
        combination_id:
          type: integer
        status:
          type: string
          enum: [pending, running, completed, failed]
        result_url:
          type: ["string", "null"]
        error_message:
          type: ["string", "null"]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: ["string", "null"]
          format: date-time

    CampaignStats:
      type: object
      properties:
        total_combinations:
          type: integer
        pending_combinations:
          type: integer
        total_batches:
          type: integer
        completed_batches:
          type: integer
        failed_items:
          type: integer
        success_rate:
          type: number

    DispatchResult:
      type: object
      properties:
        batches_created:
          type: integer
        accounts_used:
          type: integer
        combos_assigned:
          type: integer

    BlockTypeInfo:
      type: object
      properties:
        type:
          type: string
        label:
          type: string
        config_schema:
          type: object

    RenderedBlock:
      type: object
      properties:
        block_type:
          type: string
        rendered_config:
          type: object

    TemplateValidation:
      type: object
      properties:
        valid:
          type: boolean
        tokens:
          type: array
          items:
            type: string
        error:
          type: ["string", "null"]

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

# ==========================================================================
# Paths
# ==========================================================================
paths:

  # ── Auth ─────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create a new user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                display_name:
                  type: string
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Get JWT tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Update own profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        "204":
          description: Password changed

  # ── Admin ────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      parameters:
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/perPageParam"
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"

  /admin/users/{id}:
    get:
      tags: [admin]
      operationId: getUser
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      tags: [admin]
      operationId: updateUser
      parameters:
        - $ref: "#/components/parameters/pathId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [admin, operator]
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ── Platforms ────────────────────────────────────────────────────────────
  /platforms:
    get:
      tags: [platforms]
      operationId: listPlatforms
      summary: All supported blog platforms
      responses:
        "200":
          description: Platform list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Platform"

  # ── Accounts ─────────────────────────────────────────────────────────────
  /accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: My blog accounts
      parameters:
        - name: platform_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled, cooldown]
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      tags: [accounts]
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform_id, username, password]
              properties:
                platform_id:
                  type: integer
                username:
                  type: string
                password:
                  type: string
                meta:
                  type: object
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /accounts/{id}:
    get:
      tags: [accounts]
      operationId: getAccount
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "200":
          description: Account detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
    patch:
      tags: [accounts]
      operationId: updateAccount
      parameters:
        - $ref: "#/components/parameters/pathId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                meta:
                  type: object
                cooldown_days:
                  type: integer
                status:
                  type: string
                note:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
    delete:
      tags: [accounts]
      operationId: deleteAccount
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "204":
          description: Deleted

  # ── Keyword Categories ──────────────────────────────────────────────────
  /keyword-categories:
    get:
      tags: [keywords]
      operationId: listCategories
      summary: All keyword categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeywordCategory"
    post:
      tags: [keywords]
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                slug:
                  type: string
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordCategory"

  /keyword-categories/{id}:
    patch:
      tags: [keywords]
      operationId: updateCategory
      parameters:
        - $ref: "#/components/parameters/pathId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeywordCategory"
    delete:
      tags: [keywords]
      operationId: deleteCategory
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "204":
          description: Deleted

  # ── Keywords ─────────────────────────────────────────────────────────────
  /keyword-categories/{id}/keywords:
    get:
      tags: [keywords]
      operationId: listKeywords
      summary: Keywords in a category
      parameters:
        - $ref: "#/components/parameters/pathId"
        - name: tree
          in: query
          description: Return as nested tree
          schema:
            type: boolean
            default: false
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Keyword list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Keyword"
    post:
      tags: [keywords]
      operationId: createKeyword
      parameters:
        - $ref: "#/components/parameters/pathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
                display_value:
                  type: string
                parent_id:
                  type: ["integer", "null"]
                tier:
                  type: integer
                  default: 1
                metadata:
                  type: object
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keyword"

  /keywords/{id}:
    get:
      tags: [keywords]
      operationId: getKeyword
      summary: Keyword with children and affixes
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "200":
          description: Keyword detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keyword"
    patch:
      tags: [keywords]
      operationId: updateKeyword
      parameters:
        - $ref: "#/components/parameters/pathId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                display_value:
                  type: string
                parent_id:
                  type: ["integer", "null"]
                tier:
                  type: integer
                active:
                  type: boolean
                sort_order:
                  type: integer
                metadata:
                  type: object
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Keyword"
    delete:
      tags: [keywords]
      operationId: deleteKeyword
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "204":
          description: Deleted

  # ── Affixes ──────────────────────────────────────────────────────────────
  /keywords/{id}/affixes:
    get:
      tags: [keywords]
      operationId: listAffixes
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "200":
          description: Affix list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Affix"
    post:
      tags: [keywords]
      operationId: createAffix
      parameters:
        - $ref: "#/components/parameters/pathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, value]
              properties:
                type:
                  type: string
                  enum: [prefix, suffix]
                value:
                  type: string
                sort_order:
                  type: integer
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affix"

  /affixes/{id}:
    patch:
      tags: [keywords]
      operationId: updateAffix
      parameters:
        - $ref: "#/components/parameters/pathId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                sort_order:
                  type: integer
                active:
                  type: boolean
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affix"
    delete:
      tags: [keywords]
      operationId: deleteAffix
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "204":
          description: Deleted

  # ── Post Layouts ─────────────────────────────────────────────────────────
  /layouts:
    get:
      tags: [layouts]
      operationId: listLayouts
      summary: My post layouts
      responses:
        "200":
          description: Layout list without slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PostLayout"
    post:
      tags: [layouts]
      operationId: createLayout
      summary: Create layout with optional initial slots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                slots:
                  type: array
                  items:
                    type: object
                    required: [sort_order, block_type]
                    properties:
                      sort_order:
                        type: integer
                      block_type:
                        type: string
                        enum: [heading, paragraph, image, featured, list, quote, divider]
                      config:
                        type: object
      responses:
        "201":
          description: Created with slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostLayout"

  /layouts/{id}:
    get:
      tags: [layouts]
      operationId: getLayout
      summary: Layout with all slots
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "200":
          description: Layout with slots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostLayout"
    patch:
      tags: [layouts]
      operationId: updateLayout
      parameters:
        - $ref: "#/components/parameters/pathId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostLayout"
    delete:
      tags: [layouts]
      operationId: deleteLayout
      summary: Delete layout (CASCADE deletes slots)
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "204":
          description: Deleted

  /layouts/{id}/slots:
    put:
      tags: [layouts]
      operationId: replaceSlots
      summary: Replace all slots at once (drag-and-drop save)
      parameters:
        - $ref: "#/components/parameters/pathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [sort_order, block_type]
                properties:
                  sort_order:
                    type: integer
                  block_type:
                    type: string
