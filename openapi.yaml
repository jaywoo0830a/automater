openapi: 3.2.0
info:
  title: Automater API
  version: 2.0.0
  description: |
    Blog automation campaign management API.

    Two user profiles:
      - General user (민지): Excel upload → generate → dispatch
      - Power user (운영자): Full entity control, manual token/keyword/affix management

servers:
  - url: /api/v2
    description: Development

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Registration, login, profile
  - name: platforms
    description: Supported blog platforms (read-only)
  - name: accounts
    description: Platform login credentials
  - name: campaigns
    description: Campaign CRUD
  - name: tokens
    description: Title template tokens (keyword / pool / literal)
  - name: palette-items
    description: Individual pool values within a token
  - name: picks
    description: Per-campaign keyword selection
  - name: affix-overrides
    description: Per-campaign, per-keyword affix toggle
  - name: spacing-rules
    description: Spacing patterns for title generation
  - name: combinations
    description: Generated keyword combinations
  - name: batches
    description: Batch dispatch and monitoring
  - name: bulk-import
    description: Excel → combinations convenience pipeline
  - name: keyword-categories
    description: Global keyword category registry
  - name: keywords
    description: Global keyword registry
  - name: affixes
    description: Global affix dictionary
  - name: layouts
    description: Reusable post body templates
  - name: layout-slots
    description: Individual blocks within a layout
  - name: presets
    description: Publish and run setting presets
  - name: media
    description: User-uploaded images and files

paths:

  # =====================================================================
  # Auth
  # =====================================================================

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate and receive JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Update display name or password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # =====================================================================
  # Platforms
  # =====================================================================

  /platforms:
    get:
      tags: [platforms]
      operationId: listPlatforms
      summary: List supported platforms
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Platform"

  /platforms/{platformId}:
    parameters:
      - $ref: "#/components/parameters/platformId"
    get:
      tags: [platforms]
      operationId: getPlatform
      summary: Get platform details
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Platform"

  # =====================================================================
  # Accounts
  # =====================================================================

  /accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: List user's platform accounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Register a platform account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/accountId"
    get:
      tags: [accounts]
      operationId: getAccount
      summary: Get account details
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [accounts]
      operationId: updateAccount
      summary: Update account fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
    delete:
      tags: [accounts]
      operationId: deleteAccount
      summary: Delete account
      responses:
        "204":
          description: Deleted

  # =====================================================================
  # Campaigns
  # =====================================================================

  /campaigns:
    get:
      tags: [campaigns]
      operationId: listCampaigns
      summary: List user's campaigns
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignSummary"
    post:
      tags: [campaigns]
      operationId: createCampaign
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{campaignId}:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    get:
      tags: [campaigns]
      operationId: getCampaign
      summary: Full campaign detail (tokens, derived template)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [campaigns]
      operationId: updateCampaign
      summary: Update campaign metadata or preset bindings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    delete:
      tags: [campaigns]
      operationId: deleteCampaign
      summary: Delete campaign
      responses:
        "204":
          description: Deleted

  /campaigns/{campaignId}/overview:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    get:
      tags: [campaigns]
      operationId: getCampaignOverview
      summary: Dashboard stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignOverview"

  /campaigns/{campaignId}/clone:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    post:
      tags: [campaigns]
      operationId: cloneCampaign
      summary: Clone campaign (tokens, picks, spacing rules)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Name for the cloned campaign
      responses:
        "201":
          description: Cloned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{campaignId}/preview-title:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    get:
      tags: [campaigns]
      operationId: previewTitle
      summary: Generate a sample title from current tokens and picks
      parameters:
        - name: seed
          in: query
          schema:
            type: integer
          description: Random seed for reproducible preview
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  template:
                    type: string
                  sample_title:
                    type: string
                  values_used:
                    type: object

  # =====================================================================
  # Template Tokens
  # =====================================================================

  /campaigns/{campaignId}/tokens:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    get:
      tags: [tokens]
      operationId: listTokens
      summary: List tokens in sort_order
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateToken"
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create a token (keyword, pool, or literal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateTokenCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateToken"
        "409":
          description: Slug collision

  /campaigns/{campaignId}/tokens/reorder:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    put:
      tags: [tokens]
      operationId: reorderTokens
      summary: Set token order (changes derived template)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token_ids]
              properties:
                token_ids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateToken"

  /campaigns/{campaignId}/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/campaignId"
      - $ref: "#/components/parameters/tokenId"
    get:
      tags: [tokens]
      operationId: getToken
      summary: Get token detail (with palette if pool)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateToken"
    patch:
      tags: [tokens]
      operationId: updateToken
      summary: Update slug, value, or category binding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateTokenUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateToken"
    delete:
      tags: [tokens]
      operationId: deleteToken
      summary: Delete token (cascade deletes slot or palette)
      responses:
        "204":
          description: Deleted

  # =====================================================================
  # Palette Items (within a pool token)
  # =====================================================================

  /campaigns/{campaignId}/tokens/{tokenId}/items:
    parameters:
      - $ref: "#/components/parameters/campaignId"
      - $ref: "#/components/parameters/tokenId"
    get:
      tags: [palette-items]
      operationId: listPaletteItems
      summary: List items in a pool token's palette
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaletteItem"
    post:
      tags: [palette-items]
      operationId: createPaletteItem
      summary: Add a value to the palette
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaletteItemCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaletteItem"

  /campaigns/{campaignId}/tokens/{tokenId}/items/reorder:
    parameters:
      - $ref: "#/components/parameters/campaignId"
      - $ref: "#/components/parameters/tokenId"
    put:
      tags: [palette-items]
      operationId: reorderPaletteItems
      summary: Set item order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids]
              properties:
                item_ids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: Reordered

  /campaigns/{campaignId}/tokens/{tokenId}/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/campaignId"
      - $ref: "#/components/parameters/tokenId"
      - $ref: "#/components/parameters/itemId"
    patch:
      tags: [palette-items]
      operationId: updatePaletteItem
      summary: Update value or active flag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaletteItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaletteItem"
    delete:
      tags: [palette-items]
      operationId: deletePaletteItem
      summary: Remove item from palette
      responses:
        "204":
          description: Deleted

  # =====================================================================
  # Picks
  # =====================================================================

  /campaigns/{campaignId}/picks:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    get:
      tags: [picks]
      operationId: listPicks
      summary: Current picks per category
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
    put:
      tags: [picks]
      operationId: savePicks
      summary: Replace picks for one category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePicksRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
    delete:
      tags: [picks]
      operationId: clearAllPicks
      summary: Clear all picks for this campaign
      responses:
        "204":
          description: Cleared

  # =====================================================================
  # Affix Overrides
  # =====================================================================

  /campaigns/{campaignId}/affix-overrides:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    get:
      tags: [affix-overrides]
      operationId: listAffixOverrides
      summary: List overrides for this campaign
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AffixOverride"
    put:
      tags: [affix-overrides]
      operationId: upsertAffixOverride
      summary: Set active/inactive for one (keyword, affix) pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffixOverrideUpsert"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffixOverride"

  /campaigns/{campaignId}/affix-overrides/bulk:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    put:
      tags: [affix-overrides]
      operationId: bulkSetAffixOverrides
      summary: Set multiple overrides at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overrides]
              properties:
                overrides:
                  type: array
                  items:
                    $ref: "#/components/schemas/AffixOverrideUpsert"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AffixOverride"

  /campaigns/{campaignId}/affix-overrides/{overrideId}:
    parameters:
      - $ref: "#/components/parameters/campaignId"
      - $ref: "#/components/parameters/overrideId"
    delete:
      tags: [affix-overrides]
      operationId: deleteAffixOverride
      summary: Remove override (revert to default active=true)
      responses:
        "204":
          description: Deleted

  # =====================================================================
  # Spacing Rules
  # =====================================================================

  /campaigns/{campaignId}/spacing-rules:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    get:
      tags: [spacing-rules]
      operationId: listSpacingRules
      summary: List spacing rules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpacingRule"
    post:
      tags: [spacing-rules]
      operationId: createSpacingRule
      summary: Create a spacing rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpacingRuleCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpacingRule"

  /campaigns/{campaignId}/spacing-rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/campaignId"
      - $ref: "#/components/parameters/ruleId"
    get:
      tags: [spacing-rules]
      operationId: getSpacingRule
      summary: Get rule detail
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpacingRule"
    patch:
      tags: [spacing-rules]
      operationId: updateSpacingRule
      summary: Update pattern, description, or active flag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpacingRuleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpacingRule"
    delete:
      tags: [spacing-rules]
      operationId: deleteSpacingRule
      summary: Delete rule
      responses:
        "204":
          description: Deleted

  # =====================================================================
  # Combinations
  # =====================================================================

  /campaigns/{campaignId}/combinations:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    get:
      tags: [combinations]
      operationId: listCombinations
      summary: Paginated combination list
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: status
          in: query
          schema:
            type: string
            enum: [unused, used, all]
            default: all
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CombinationPage"

  /campaigns/{campaignId}/combinations/generate:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    post:
      tags: [combinations]
      operationId: generateCombinations
      summary: Generate from current picks + spacing rules (dedup, no stale cleanup)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResult"

  /campaigns/{campaignId}/combinations/{combinationId}:
    parameters:
      - $ref: "#/components/parameters/campaignId"
      - $ref: "#/components/parameters/combinationId"
    get:
      tags: [combinations]
      operationId: getCombination
      summary: Combination detail with keywords
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Combination"
    delete:
      tags: [combinations]
      operationId: deleteCombination
      summary: Delete one combination (fails if dispatched)
      responses:
        "204":
          description: Deleted
        "409":
          description: Cannot delete — has batch items

  /campaigns/{campaignId}/combinations/delete-unused:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    post:
      tags: [combinations]
      operationId: deleteUnusedCombinations
      summary: Delete all undispatched combinations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                  preserved:
                    type: integer

  # =====================================================================
  # Batches
  # =====================================================================

  /campaigns/{campaignId}/batches:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    get:
      tags: [batches]
      operationId: listBatches
      summary: List batches
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Batch"
    post:
      tags: [batches]
      operationId: dispatchBatch
      summary: Dispatch combinations to an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchRequest"
      responses:
        "201":
          description: Dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"

  /campaigns/{campaignId}/batches/{batchId}:
    parameters:
      - $ref: "#/components/parameters/campaignId"
      - $ref: "#/components/parameters/batchId"
    get:
      tags: [batches]
      operationId: getBatch
      summary: Batch detail with items
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDetail"

  /campaigns/{campaignId}/batches/{batchId}/cancel:
    parameters:
      - $ref: "#/components/parameters/campaignId"
      - $ref: "#/components/parameters/batchId"
    post:
      tags: [batches]
      operationId: cancelBatch
      summary: Cancel a pending batch
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "409":
          description: Cannot cancel — already running or completed

  # =====================================================================
  # Bulk Import
  # =====================================================================

  /campaigns/{campaignId}/import/excel:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    post:
      tags: [bulk-import]
      operationId: importExcel
      summary: Upload Excel → auto-import keywords
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                header_map:
                  type: string
                  description: "JSON {header: slug} overrides"
                auto_detect_affixes:
                  type: boolean
                  default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /campaigns/{campaignId}/import/keywords:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    post:
      tags: [bulk-import]
      operationId: importKeywords
      summary: Import keywords from JSON dict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportKeywordsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /campaigns/{campaignId}/import/pools:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    post:
      tags: [bulk-import]
      operationId: importPools
      summary: Import palette pools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPoolsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolImportResult"

  /campaigns/{campaignId}/import/generate:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    post:
      tags: [bulk-import]
      operationId: importGenerate
      summary: Cleanup stale + generate new combinations
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                spacing_patterns:
                  type: array
                  items:
                    type: object
                    additionalProperties:
                      type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResult"

  /campaigns/{campaignId}/reset/soft:
    parameters:
      - $ref: "#/components/parameters/campaignId"
    post:
      tags: [bulk-import]
      operationId: softReset
      summary: Delete undispatched combinations only
      responses:
