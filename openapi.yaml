# ===================================================================
# Components
# ===================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    platformId:
      name: platformId
      in: path
      required: true
      schema: { type: integer }
    accountId:
      name: accountId
      in: path
      required: true
      schema: { type: integer }
    campaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: integer }
    tokenId:
      name: tokenId
      in: path
      required: true
      schema: { type: integer }
    itemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer }
    overrideId:
      name: overrideId
      in: path
      required: true
      schema: { type: integer }
    ruleId:
      name: ruleId
      in: path
      required: true
      schema: { type: integer }
    combinationId:
      name: combinationId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    batchId:
      name: batchId
      in: path
      required: true
      schema: { type: integer }
    categoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: integer }
    keywordId:
      name: keywordId
      in: path
      required: true
      schema: { type: integer }
    affixId:
      name: affixId
      in: path
      required: true
      schema: { type: integer }
    layoutId:
      name: layoutId
      in: path
      required: true
      schema: { type: integer }
    slotId:
      name: slotId
      in: path
      required: true
      schema: { type: integer }
    presetId:
      name: presetId
      in: path
      required: true
      schema: { type: integer }
    mediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: integer }

  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

    # -- Auth --
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        display_name: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UpdateMeRequest:
      type: object
      properties:
        display_name: { type: string }
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }
    AuthTokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, default: bearer }
        user: { $ref: "#/components/schemas/User" }
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [operator, admin] }
        status: { type: string }
        created_at: { type: string, format: date-time }

    # -- Platform --
    Platform:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        base_url: { type: string }
        status: { type: string }

    # -- Account --
    Account:
      type: object
      properties:
        id: { type: integer }
        platform_id: { type: integer }
        platform_name: { type: string }
        username: { type: string }
        cooldown_days: { type: integer }
        last_used_at: { type: string, format: date-time, nullable: true }
        status: { type: string }
        note: { type: string }
        created_at: { type: string, format: date-time }
    AccountCreate:
      type: object
      required: [platform_id, username, password]
      properties:
        platform_id: { type: integer }
        username: { type: string }
        password: { type: string }
        cooldown_days: { type: integer, default: 14 }
        note: { type: string }
    AccountUpdate:
      type: object
      properties:
        password: { type: string }
        cooldown_days: { type: integer }
        status: { type: string }
        note: { type: string }

    # -- Campaign --
    CampaignSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        platform_name: { type: string }
        status: { type: string }
        combination_count: { type: integer }
        batch_count: { type: integer }
        created_at: { type: string, format: date-time }
    Campaign:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        platform_id: { type: integer }
        layout_id: { type: integer, nullable: true }
        publish_preset_id: { type: integer, nullable: true }
        run_preset_id: { type: integer, nullable: true }
        config: { type: object, nullable: true }
        status: { type: string }
        derived_template: { type: string }
        tokens:
          type: array
          items: { $ref: "#/components/schemas/TemplateToken" }
        created_at: { type: string, format: date-time }
    CampaignCreate:
      type: object
      required: [name, platform_id]
      properties:
        name: { type: string }
        description: { type: string }
        platform_id: { type: integer }
        layout_id: { type: integer }
        publish_preset_id: { type: integer }
        run_preset_id: { type: integer }
    CampaignUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        layout_id: { type: integer, nullable: true }
        publish_preset_id: { type: integer, nullable: true }
        run_preset_id: { type: integer, nullable: true }
        status: { type: string }
    CampaignOverview:
      type: object
      properties:
        campaign_id: { type: integer }
        derived_template: { type: string }
        token_count: { type: integer }
        combination_total: { type: integer }
        combination_unused: { type: integer }
        combination_used: { type: integer }
        batch_pending: { type: integer }
        batch_running: { type: integer }
        batch_completed: { type: integer }

    # -- Template Token --
    TemplateToken:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        token_type: { type: string, enum: [keyword, pool, literal] }
        sort_order: { type: integer }
        value: { type: string, nullable: true }
        category_id: { type: integer, nullable: true }
        category_name: { type: string, nullable: true }
        palette:
          nullable: true
          $ref: "#/components/schemas/Palette"
        created_at: { type: string, format: date-time }
    TemplateTokenCreate:
      type: object
      required: [slug, token_type]
      properties:
        slug: { type: string }
        token_type: { type: string, enum: [keyword, pool, literal] }
        sort_order: { type: integer }
        value: { type: string }
        category_id: { type: integer }
        palette:
          type: object
          properties:
            strategy: { type: string, enum: [random, sequential], default: random }
            items:
              type: array
              items: { type: string }
    TemplateTokenUpdate:
      type: object
      properties:
        slug: { type: string }
        value: { type: string }
        category_id: { type: integer }

    # -- Palette --
    Palette:
      type: object
      properties:
        strategy: { type: string, enum: [random, sequential] }
        items:
          type: array
          items: { $ref: "#/components/schemas/PaletteItem" }
    PaletteItem:
      type: object
      properties:
        id: { type: integer }
        value: { type: string }
        sort_order: { type: integer }
        active: { type: boolean }
    PaletteItemCreate:
      type: object
      required: [value]
      properties:
        value: { type: string }
    PaletteItemUpdate:
      type: object
      properties:
        value: { type: string }
        active: { type: boolean }

    # -- Picks --
    SavePicksRequest:
      type: object
      required: [category_slug, values]
      properties:
        category_slug: { type: string }
        values:
          type: array
          items: { type: string }

    # -- Affix Override --
    AffixOverride:
      type: object
      properties:
        id: { type: integer }
        keyword_id: { type: integer }
        keyword_value: { type: string }
        affix_id: { type: integer }
        affix_type: { type: string }
        affix_value: { type: string }
        active: { type: boolean }
    AffixOverrideUpsert:
      type: object
      required: [keyword_id, affix_id, active]
      properties:
        keyword_id: { type: integer }
        affix_id: { type: integer }
        active: { type: boolean }

    # -- Spacing Rule --
    SpacingRule:
      type: object
      properties:
        id: { type: integer }
        pattern:
          type: object
          additionalProperties: { type: integer }
        description: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    SpacingRuleCreate:
      type: object
      required: [pattern]
      properties:
        pattern:
          type: object
          additionalProperties: { type: integer }
        description: { type: string }
    SpacingRuleUpdate:
      type: object
      properties:
        pattern:
          type: object
          additionalProperties: { type: integer }
        description: { type: string }
        active: { type: boolean }

    # -- Combination --
    Combination:
      type: object
      properties:
        id: { type: integer, format: int64 }
        spacing_rule_id: { type: integer, nullable: true }
        keywords:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              category_slug: { type: string }
              value: { type: string }
              display_value: { type: string }
        used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    CombinationPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Combination" }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
        pages: { type: integer }

    # -- Batch --
    Batch:
      type: object
      properties:
        id: { type: integer }
        campaign_id: { type: integer }
        account_id: { type: integer }
        account_username: { type: string }
        scheduled_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, running, completed, failed, cancelled] }
        item_count: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
    BatchDetail:
      allOf:
        - $ref: "#/components/schemas/Batch"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/BatchItem" }
    BatchItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        combination_id: { type: integer, format: int64 }
        status: { type: string, enum: [pending, running, completed, failed] }
        result_url: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    DispatchRequest:
      type: object
      required: [account_id, scheduled_at]
      properties:
        account_id: { type: integer }
        scheduled_at: { type: string, format: date-time }
        max_items: { type: integer }

    # -- Bulk Import --
    ImportKeywordsRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        auto_detect_affixes:
          type: boolean
          default: false
    ImportPoolsRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    ImportResult:
      type: object
      properties:
        categories_created: { type: integer }
        keywords_created: { type: integer }
        keywords_existing: { type: integer }
        tokens_created: { type: integer }
        picks_set: { type: integer }
    PoolImportResult:
      type: object
      properties:
        pools_created: { type: integer }
        items_created: { type: integer }
        items_existing: { type: integer }
    GenerateResult:
      type: object
      properties:
        combinations_generated: { type: integer }
        combinations_stale: { type: integer }
        spacing_rules_created: { type: integer }
    ResetResult:
      type: object
      properties:
        combinations_removed: { type: integer }
        combinations_preserved: { type: integer }
        tokens_removed: { type: integer }
        picks_removed: { type: integer }
        spacing_rules_removed: { type: integer }

    # -- Keyword Category --
    KeywordCategory:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        keyword_count: { type: integer }
        created_at: { type: string, format: date-time }
    KeywordCategoryCreate:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
    KeywordCategoryUpdate:
      type: object
      properties:
        name: { type: string }
        slug: { type: string }

    # -- Keyword --
    Keyword:
      type: object
      properties:
        id: { type: integer }
        category_id: { type: integer }
        value: { type: string }
        display_value: { type: string }
        active: { type: boolean }
        sort_order: { type: integer }
        affixes:
          type: array
          items: { $ref: "#/components/schemas/Affix" }
        created_at: { type: string, format: date-time }
    KeywordCreate:
      type: object
      required: [value]
      properties:
        value: { type: string }
        display_value: { type: string }
    KeywordUpdate:
      type: object
      properties:
        value: { type: string }
        display_value: { type: string }
        active: { type: boolean }
        sort_order: { type: integer }

    # -- Affix --
    Affix:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [prefix, suffix] }
        value: { type: string }
        sort_order: { type: integer }
        keyword_count: { type: integer }
    AffixCreate:
      type: object
      required: [type, value]
      properties:
        type: { type: string, enum: [prefix, suffix] }
        value: { type: string }
    AffixUpdate:
      type: object
      properties:
        value: { type: string }
        sort_order: { type: integer }

    # -- Layout --
    PostLayout:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        slots:
          type: array
          items: { $ref: "#/components/schemas/LayoutSlot" }
        created_at: { type: string, format: date-time }
    PostLayoutCreate:
      type: object
      required: [name, slots]
      properties:
        name: { type: string }
        description: { type: string }
        slots:
          type: array
          items: { $ref: "#/components/schemas/LayoutSlotCreate" }
    LayoutSlot:
      type: object
      properties:
        id: { type: integer }
        sort_order: { type: integer }
        block_type: { type: string }
        config: { type: object }
    LayoutSlotCreate:
      type: object
      required: [sort_order, block_type]
      properties:
        sort_order: { type: integer }
        block_type: { type: string }
        config: { type: object }
    LayoutSlotUpdate:
      type: object
      properties:
        block_type: { type: string }
        config: { type: object }

    # -- Preset --
    Preset:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        config: { type: object }
        created_at: { type: string, format: date-time }
    PresetCreate:
      type: object
      required: [name, config]
      properties:
        name: { type: string }
        description: { type: string }
        config: { type: object }
    PresetUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        config: { type: object }

    # -- Media --
    Media:
      type: object
      properties:
        id: { type: integer }
        original_name: { type: string }
        content_type: { type: string }
        storage_path: { type: string }
        size_bytes: { type: integer }
        created_at: { type: string, format: date-time }
